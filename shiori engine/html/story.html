<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小剧场 - 场景鉴赏</title>
    <link rel="icon" type="image/png" href="../icon/icon-32.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../assets/cg/bg.jpg') center center/cover no-repeat;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 75%;
            margin-top: calc(70 * var(--v, 1px)); /* 为固定顶部菜单留出空间 */
            margin-left: auto;
            margin-right: auto;
            background: transparent;
            padding: calc(15 * var(--u, 1px));
            border-radius: calc(8 * var(--u, 1px));
            box-shadow: none;
        }
        
        h1 {
            color: #FFD700;
            text-align: center;
            margin: calc(40 * var(--v, 1px)) auto calc(20 * var(--v, 1px)) auto;
            font-size: calc(32 * var(--u, 1px));
            text-shadow: 0 0 calc(10 * var(--u, 1px)) rgba(255, 215, 0, 0.5);
            width: fit-content;
        }
        
        .jump-section {
            margin: calc(15 * var(--v, 1px)) 0;
        }
        
        h2 {
            margin: calc(20 * var(--v, 1px)) auto calc(15 * var(--v, 1px)) auto;
            color: #FFD700;
            font-size: calc(18 * var(--u, 1px));
            text-shadow: 0 0 calc(5 * var(--u, 1px)) rgba(255, 215, 0, 0.8);
            width: fit-content;
            text-align: center;
        }
        
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: calc(10 * var(--u, 1px));
            margin-bottom: calc(20 * var(--v, 1px));
            justify-content: center;
        }
        
        .scene-card {
            background-color: transparent;
            border: 1px solid #4CAF50;
            border-radius: calc(6 * var(--u, 1px));
            padding: calc(10 * var(--u, 1px));
            text-align: center;
            min-height: calc(60 * var(--v, 1px));
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .scene-card button {
            background-color: rgba(33, 150, 243, 0.8);
            color: white;
            padding: calc(8 * var(--u, 1px));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: calc(4 * var(--u, 1px));
            cursor: pointer;
            font-size: calc(14 * var(--u, 1px));
            margin-top: calc(8 * var(--v, 1px));
            width: 100%;
        }
        
        .scene-card button:hover {
            background-color: #1976D2;
        }
        
        .actions {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            text-align: center;
            margin: 0;
            padding: calc(10 * var(--u, 1px));
            border: none;
            border-bottom: 1px solid #FFD700;
            background-color: transparent;
            box-shadow: 0 calc(2 * var(--u, 1px)) calc(5 * var(--u, 1px)) rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: calc(10 * var(--u, 1px));
        }
        
        button {
            background-color: transparent;
            color: #FFD700;
            padding: calc(8 * var(--v, 1px)) calc(16 * var(--u, 1px));
            border: calc(2 * var(--u, 1px)) solid #FFD700;
            border-radius: calc(20 * var(--u, 1px));
            cursor: pointer;
            margin: 0 calc(5 * var(--u, 1px));
            font-size: calc(14 * var(--u, 1px));
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: calc(2 * var(--u, 1px)) solid #FFA500;
        }
        
        
        
        
        
        


        
        


        
        


        
        


        
        /* 隐藏游戏相关元素（!important：官方 style.css 后注入，否则对话框底边黑条） */
        #background-container,
        #character-container,
        #text-box-container,
        #options-container,
        #novel-mode-container {
            display: none !important;
        }
        
        /* 音频播放器保持隐藏 */
        audio {
            display: none;
        }
    </style>
<script src="../config/illustration.js"></script>
<link rel="stylesheet" href="../ui/ui_skin.css">
<script src="../ui/ui_skin.js"></script>
</head>
<body>
    <!-- 背景容器 -->
    <div id="background-container"></div>
    
    <!-- 角色立绘容器 -->
    <div id="character-container"></div>
    
    <!-- 文本框区域 -->
    <div id="text-box-container">
                <div id="name-box">
<span>[姓名]</span>
        </div>
        <div id="text-box">[文本]</div>
    </div>
    
    <!-- 选项容器 -->
    <div id="options-container"></div>
    
    <!-- 全屏文本模式 -->
    <div id="novel-mode-container">
        <div id="novel-text-box">[全屏文本]</div>
    </div>
    
    <!-- 音频播放器 -->
    <audio id="bgm-player" loop></audio>
    <audio id="se-player"></audio>
    <audio id="voice-player"></audio>
    
    <div class="container">
        <div class="actions">
            <button onclick="location.href='../index.html'" class="back" data-ui="sub_back">返回主菜单(esc)</button>
            <button id="return-current-btn" onclick="handleReturnCurrent()" style="display: none;" data-ui="sub_return">返回当前游玩</button>
        </div>
        
        <h1 id="page-title">小故事</h1>
        
        <div class="jump-section">
            <h2>所有场景列表</h2>
            <div id="scene-grid" class="scene-grid">
                <!-- 动态加载所有场景按钮 -->
            </div>
        </div>
    </div>

    <script>
        // 预定义的所有场景列表
        const ALL_SCENES = [
            { id: 'story1', name: '引子' },
            { id: 'story2', name: '第一章' },
            { id: 'story3', name: '第二章 夜晚回忆' },
            { id: 'story4', name: '第三章' },
        ];
        
        // 渲染所有场景卡片
        function renderAllScenes() {
            const sceneGrid = document.getElementById('scene-grid');
            sceneGrid.innerHTML = '';
            
            ALL_SCENES.forEach(scene => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'scene-card';
                cardDiv.setAttribute('data-ui', 'story_item');
                cardDiv.innerHTML = `
                    <div class="scene-name">${scene.name}</div>
                    <button onclick="jumpToScene('${scene.id}.html')">
                        观看
                    </button>
                `;
                sceneGrid.appendChild(cardDiv);
            });
        }
        
        // 跳转到指定场景
        function jumpToScene(sceneFileName) {
            // ★ 场景入口跳入信号：目标场景加载后，engine.js 会读取
            // localStorage['shiori_scene_entry_' + sceneFileName] 中的 f.（该场景最近一次
            // 经 nextScene / choice 正常流程进入时的变量），实现“从头播放但变量接续”。
            // 同时清除可能残留的 nextScene 信号，避免被误判为跨场景续玩。
            try {
                sessionStorage.removeItem('shiori_next_scene_target');
                sessionStorage.setItem('shiori_scene_entry_jump', '1');
            } catch (e) {}
            window.location.href = '../scenes/' + sceneFileName;
        }
        
        // 检查是否从剧情页面进入
        function checkFromScene() {
            try {
                const snapshotStr = sessionStorage.getItem('gameStateSnapshot');
                if (snapshotStr) {
                    const snapshot = JSON.parse(snapshotStr);
                    if (snapshot.pagePath && snapshot.pagePath.includes('/scenes/')) {
                        // 显示返回当前游玩按钮
                        const returnBtn = document.getElementById('return-current-btn');
                        if (returnBtn) {
                            returnBtn.style.display = 'inline-block';
                        }
                    }
                }
            } catch (e) {
                console.error('[Story] Failed to check scene state:', e);
            }
        }
        
        // 返回当前游玩页面
        function handleReturnCurrent() {
            try {
                const snapshotStr = sessionStorage.getItem('gameStateSnapshot');
                if (!snapshotStr) {
                    alert('没有找到当前游玩状态');
                    return;
                }
                
                const snapshot = JSON.parse(snapshotStr);
                
                // 在URL中添加行号参数
                const url = new URL(snapshot.pageUrl, window.location.origin);
                url.searchParams.set('startLine', snapshot.currentLine);
                window.location.href = url.toString();
            } catch (e) {
                console.error('[Story] Failed to return:', e);
                alert('返回失败');
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderAllScenes();
            checkFromScene();
        });
        
        // ESC键返回主菜单
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
