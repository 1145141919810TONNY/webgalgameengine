<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频鉴赏</title>
    <link rel="icon" type="image/png" href="../icon/icon-32.png">
    <link rel="stylesheet" href="../style.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../assets/cg/bg.jpg') center center/cover no-repeat;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 菜单容器 - 占据整个屏幕 */
        #menu-container {
            position: absolute;
            right: 0;
            top: 80px; /* 留出标题空间 */
            width: 100%;
            height: calc(100% - 150px); /* 减去标题和控制按钮的空间 */
            background-color: transparent;
            display: grid;
            grid-template-columns: 1fr 1fr;  /* 两排布局 */
            grid-auto-rows: auto;
            gap: 15px;
            justify-content: center;
            align-content: start; /* 内容从顶部开始排列 */
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* 添加垂直滚动 */
            overflow-x: hidden; /* 防止水平滚动 */
        }

        /* 页面标题 */
        #page-title {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #FFD700;
            font-size: 32px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 20;
        }

        /* 菜单按钮 */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 5px;
            background-color: transparent;
            color: #FFD700;
            border: 3px solid #FFD700;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: 3px solid #FFA500;
        }
        
        /* 返回按钮 */
        .back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .back-btn:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: 2px solid #FFA500;
        }

        /* 隐藏游戏相关元素 */
        #background-container,
        #character-container,
        #text-box-container,
        #options-container,
        #novel-mode-container {
            display: none;
        }

        /* 音频播放器保持隐藏 */
        audio {
            display: none;
        }
        
        /* 视频播放器样式 */
        #video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: none;
        }
        
        /* 控制按钮容器 */
        .control-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            z-index: 100;
            transition: opacity 0.3s ease;
            pointer-events: auto; /* 确保始终可以接收鼠标事件 */
        }
        
        /* 视频播放时默认隐藏（仅透明，仍可接收鼠标事件） */
        .control-buttons.video-playing {
            opacity: 0;
        }
        
        /* 视频播放时，鼠标悬停显示 */
        .control-buttons.video-playing.visible {
            opacity: 1;
        }
        
        /* 控制按钮样式 */
        .control-btn {
            padding: 10px 15px;
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .control-btn:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: 2px solid #FFA500;
        }
        
        #video-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* ========================================
           响应式设计 - 小屏幕适配
           ======================================== */
        
        /* 小屏幕适配（1366x768） */
        @media (max-width: 1366px) and (max-height: 768px) {
            #page-title {
                font-size: 28px;
            }
            
            .menu-btn {
                font-size: 14px;
                padding: 12px;
            }
            
            .control-btn {
                font-size: 13px;
                padding: 8px 12px;
            }
            
            .control-buttons {
                bottom: 15px;
                right: 15px;
                gap: 6px;
            }
        }
        
        /* 更小屏幕适配（1280x720） */
        @media (max-width: 1280px) and (max-height: 720px) {
            #page-title {
                font-size: 24px;
            }
            
            .menu-btn {
                font-size: 13px;
                padding: 10px;
            }
            
            .control-btn {
                font-size: 12px;
                padding: 6px 10px;
            }
            
            .control-buttons {
                bottom: 10px;
                right: 10px;
                gap: 5px;
            }
        }
        
        /* 极小屏幕适配（< 800px） */
        @media (max-width: 800px) {
            #page-title {
                font-size: 20px;
            }
            
            /* 保持两列布局，不改为单列 */
            /* grid-template-columns: 1fr 1fr 保持不变 */
            
            .menu-btn {
                font-size: 12px;
                padding: 8px;
                /* width 保持 100% 不变 */
            }
            
            .control-buttons {
                bottom: 8px;
                right: 8px;
                gap: 4px;
            }
            
            .control-btn {
                font-size: 11px;
                padding: 5px 8px;
            }
        }
        
        /* 超小高度适配（高度 < 500px） */
        @media (max-height: 500px) {
            #page-title {
                font-size: 18px;
                top: 10px;
            }
            
            #menu-container {
                top: 50px;
                height: calc(100% - 80px);
            }
            
            .menu-btn {
                font-size: 11px;
                padding: 6px;
                margin: 3px;
            }
            
            .control-buttons {
                bottom: 5px;
                right: 5px;
                gap: 3px;
            }
            
            .control-btn {
                font-size: 9px;
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景容器 - 用作菜单背景 -->
    <div id="background-container"></div>
    
    <!-- 角色立绘容器 -->
    <div id="character-container"></div>
    
    <!-- 文本框区域 -->
    <div id="text-box-container">
                <div id="name-box">
<span>[姓名]</span>
        </div>
        <div id="text-box">[文本]</div>
    </div>
    
    <!-- 选项容器 -->
    <div id="options-container"></div>
    
    <!-- 全屏文本模式 -->
    <div id="novel-mode-container">
        <div id="novel-text-box">[全屏文本]</div>
    </div>
    
    <!-- 音频播放器 -->
    <audio id="bgm-player" loop></audio>
    <audio id="se-player"></audio>
    <audio id="voice-player"></audio>
    
    <!-- 视频播放器 -->
    <div id="video-player">
        <!-- 原生video标签（HTML和Python环境通用） -->
        <video id="main-video" style="width:100%; height:100%; object-fit:contain;">
            您的浏览器不支持视频播放。
        </video>
    </div>
    
    <!-- 控制按钮 -->
    <div class="control-buttons">
        <button class="control-btn" id="exit-playback-btn" onclick="stopVideo()" style="display:none;">退出播放</button>
        <a href="../index.html" class="control-btn">返回主菜单(esc)</a>
    </div>
    
    <!-- 页面标题 -->
    <h1 id="page-title">视频鉴赏</h1>
    
    <!-- 视频列表容器 -->
    <div id="menu-container">
        <button class="menu-btn" data-env="html" onclick="playVideo('OP')">OP视频</button>
        <button class="menu-btn" data-env="html" onclick="playVideo('video1')">宣传视频1</button>
        <button class="menu-btn" data-env="html" onclick="playVideo('video2')">宣传视频2</button>
        <button class="menu-btn" data-env="html" onclick="playVideo('video3')">宣传视频3</button>
        <button class="menu-btn" data-env="html" onclick="playVideo('video4')">宣传视频5</button>
        
    </div>
    
    <script>
        // 视频播放状态
        let isVideoPlaying = false;
        
        // 环境检测：判断是否在QtWebEngine中运行
        let isQtWebEngine = false;
        
        // 视频解码器相关（仅用于获取URL）
        let videoDecoder = null;
        
        // 检测是否在QtWebEngine环境中
        function detectEnvironment() {
            // 方法1: 检查 QWebChannel 是否存在
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                isQtWebEngine = true;
                console.log('[环境检测] 检测到 QtWebEngine 环境');
                return true;
            }
            
            // 方法2: 检查特定的 Qt 对象
            if (navigator.userAgent.indexOf('QtWebEngine') !== -1) {
                isQtWebEngine = true;
                console.log('[环境检测] UserAgent 包含 QtWebEngine');
                return true;
            }
            
            console.log('[环境检测] 使用标准浏览器环境');
            return false;
        }
        
        // 根据环境过滤视频按钮
        function filterVideoButtons() {
            const buttons = document.querySelectorAll('.menu-btn[data-env]');
            
            buttons.forEach(function(button) {
                const env = button.getAttribute('data-env');
                
                if (isQtWebEngine) {
                    // QtWebEngine环境：只显示python按钮，隐藏html按钮
                    if (env === 'python') {
                        button.style.display = 'block';
                    } else {
                        button.style.display = 'none';
                    }
                } else {
                    // 外部浏览器环境：只显示html按钮，隐藏python按钮
                    if (env === 'html') {
                        button.style.display = 'block';
                    } else {
                        button.style.display = 'none';
                    }
                }
            });
        }
        
        // 初始化视频解码器
        function initVideoDecoder(callback) {
            if (!isQtWebEngine) {
                if (callback) callback(null);
                return;
            }
            
            // 等待 QWebChannel 就绪
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    videoDecoder = channel.objects.VideoDecoder;
                    if (callback) callback(videoDecoder);
                });
            } else {
                if (callback) callback(null);
            }
        }
        
        /**
         * 获取所有视频的环境配置（供剧本引擎调用）
         * @returns {Object} - 视频名到环境的映射 {videoName: 'html'|'python'}
         */
        function getVideoEnvironmentMap() {
            const videoMap = {};
            const buttons = document.querySelectorAll('.menu-btn[data-env]');
            
            buttons.forEach(function(button) {
                const onclick = button.getAttribute('onclick');
                const env = button.getAttribute('data-env');
                
                // 从 onclick="playVideo('XXX')" 中提取视频名
                const match = onclick.match(/playVideo\(['"]([^'"]+)['"]\)/);
                if (match && match[1]) {
                    const videoName = match[1];
                    videoMap[videoName] = env;
                }
            });
            
            return videoMap;
        }
            
        // 更新退出按钮的可见性
        function updateExitButtonVisibility() {
            const exitBtn = document.getElementById('exit-playback-btn');
            if (exitBtn) {
                exitBtn.style.display = isVideoPlaying ? 'block' : 'none';
            }
        }
            
        // 从 URL参数获取视频文件名
        function getVideoFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('video');
        }
            
        // 检查是否从剧情中直接播放视频
        window.addEventListener('load', function() {
            // 先检测环境
            detectEnvironment();
            
            // 根据环境过滤视频按钮
            filterVideoButtons();
            
            const videoParam = getVideoFromUrl();
            if (videoParam) {
                // 直接播放指定的视频文件
                playSpecificVideo(videoParam);
            }
        });
            
        // 播放指定视频文件（零配置：自动解析路径）
        function playSpecificVideo(videoFileName) {
            // 构建视频路径
            let videoPath;
            if (videoFileName.startsWith('../') || videoFileName.startsWith('/')) {
                videoPath = videoFileName;
            } else {
                if (!videoFileName.includes('.')) {
                    videoPath = '../assets/video/' + videoFileName + '.mp4';
                } else {
                    videoPath = '../assets/video/' + videoFileName;
                }
            }
            
            // 检测是否在QtWebEngine环境中
            const inQtWebEngine = typeof qt !== 'undefined' && qt.webChannelTransport;
            
            // 根据环境选择播放模式
            if (inQtWebEngine) {
                // QtWebEngine环境：使用Python解码获取URL
                playVideoDecoded(videoFileName);
            } else {
                // 外部浏览器：通过HTTP服务器播放
                const isHttpProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
                
                if (isHttpProtocol) {
                    // 通过HTTP服务器访问，使用相对路径
                    playVideoNative(videoPath);
                } else {
                    alert('无法直接播放视频。\n\n请通过HTTP服务器访问此页面。');
                }
            }
        }

        // 播放预设视频（零配置：直接使用文件名）
        function playVideo(videoName) {
            // 检测是否在QtWebEngine环境中
            const inQtWebEngine = typeof qt !== 'undefined' && qt.webChannelTransport;
            
            // 根据环境选择播放模式
            if (inQtWebEngine) {
                // QtWebEngine环境：使用Python解码获取URL
                playVideoDecoded(videoName);
            } else {
                // 外部浏览器：通过HTTP服务器播放
                const isHttpProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
                
                if (isHttpProtocol) {
                    // 通过HTTP服务器访问，使用相对路径
                    let videoPath;
                    if (!videoName.includes('.')) {
                        videoPath = '../assets/video/' + videoName + '.mp4';
                    } else {
                        videoPath = '../assets/video/' + videoName;
                    }
                    playVideoNative(videoPath);
                } else {
                    alert('无法直接播放视频。\n\n请通过HTTP服务器访问此页面。');
                }
            }
        }
        
        // 原生video标签播放模式（用于外部浏览器）
        function playVideoNative(videoPath) {
            const videoPlayer = document.getElementById('video-player');
            const mainVideo = document.getElementById('main-video');
            
            if (!videoPlayer || !mainVideo) {
                return;
            }
            
            // 设置视频源
            mainVideo.src = videoPath;
            
            videoPlayer.style.display = 'block';
            isVideoPlaying = true;
            updateExitButtonVisibility();
            
            // 更新控制按钮状态为播放模式（默认隐藏）
            updateControlButtonsState();
            
            // 添加事件监听器
            mainVideo.addEventListener('ended', function() {
                stopVideo();
            }, { once: true });
            
            // 尝试播放视频
            mainVideo.play().catch(error => {
                console.error('[NativePlayer] 播放失败:', error.message);
            });
        }
        
        // Python解码播放模式（用于QtWebEngine）- 使用原生video标签
        async function playVideoDecoded(videoFileName) {
            const videoPlayer = document.getElementById('video-player');
            const mainVideo = document.getElementById('main-video');
            
            if (!videoPlayer || !mainVideo) {
                return;
            }
            
            videoPlayer.style.display = 'block';
            isVideoPlaying = true;
            updateExitButtonVisibility();
            
            // 更新控制按钮状态为播放模式（默认隐藏）
            updateControlButtonsState();
            
            // 初始化视频解码器获取URL
            initVideoDecoder(async function(decoder) {
                if (!decoder) {
                    stopVideo();
                    return;
                }
                
                try {
                    // 调用Python端加载视频
                    const result = await decoder.loadVideo(videoFileName);
                    const loadResult = JSON.parse(result);
                    
                    if (!loadResult.success) {
                        stopVideo();
                        return;
                    }
                    
                    // 使用HTTP服务器提供的视频URL播放
                    if (loadResult.videoUrl) {
                        mainVideo.src = loadResult.videoUrl;
                        
                        mainVideo.addEventListener('ended', function() {
                            stopVideo();
                        }, { once: true });
                        
                        // 开始播放
                        mainVideo.play().catch(err => {
                            console.error('[DecodedPlayer] 播放失败:', err.message);
                            stopVideo();
                        });
                    }
                } catch (err) {
                    stopVideo();
                }
            });
        }

        // 停止视频
        function stopVideo() {
            const videoPlayer = document.getElementById('video-player');
            const mainVideo = document.getElementById('main-video');
            
            // 如果是Python解码模式，通知后端关闭
            if (isQtWebEngine && videoDecoder) {
                videoDecoder.closeVideo();
            }
            
            // 停止视频播放
            if (mainVideo) {
                mainVideo.pause();
                mainVideo.currentTime = 0;
                mainVideo.removeAttribute('src');
            }
            
            if (videoPlayer) {
                videoPlayer.style.display = 'none';
            }
            
            isVideoPlaying = false;
            updateExitButtonVisibility();
            
            // 如果是通过URL参数播放的，关闭页面
            const videoParam = getVideoFromUrl();
            if (videoParam) {
                setTimeout(() => {
                    window.history.back();
                }, 100);
            }
        }
        
        // 点击视频区域外关闭视频
        document.getElementById('video-player').addEventListener('click', function(e) {
            if (e.target === this) {
                stopVideo();
            }
        });
        
        // ========================================
        // 控制按钮自动隐藏与显示功能
        // ========================================
        
        const videoPlayer = document.getElementById('video-player');
        const controlButtons = document.querySelector('.control-buttons');
        
        // 更新控制按钮状态（根据视频播放状态）
        function updateControlButtonsState() {
            if (!controlButtons) return;
            
            if (isVideoPlaying) {
                // 视频播放中：添加 video-playing 类，初始隐藏
                controlButtons.classList.add('video-playing');
                controlButtons.classList.remove('visible');
            } else {
                // 非视频播放状态：移除 video-playing 类，始终可见
                controlButtons.classList.remove('video-playing');
                controlButtons.classList.remove('visible');
            }
        }
        
        // 显示控制按钮（仅在视频播放时有效）
        function showControlButtons() {
            if (controlButtons && isVideoPlaying) {
                controlButtons.classList.add('visible');
            }
        }
        
        // 隐藏控制按钮（仅在视频播放时有效）
        function hideControlButtons() {
            if (controlButtons && isVideoPlaying) {
                controlButtons.classList.remove('visible');
            }
        }
        
        // 视频播放器鼠标事件
        if (videoPlayer) {
            // 移除 mouseenter 和 mousemove 事件，不再在视频区域显示按钮
            // 只保留 mouseleave 用于清理状态
            
            // 鼠标离开视频播放器区域时，确保按钮隐藏
            videoPlayer.addEventListener('mouseleave', function() {
                if (isVideoPlaying && controlButtons) {
                    controlButtons.classList.remove('visible');
                }
            });
        }
        
        // 控制按钮本身的悬停事件（这是唯一显示按钮的方式）
        if (controlButtons) {
            // 鼠标进入按钮区域时显示
            controlButtons.addEventListener('mouseenter', function() {
                if (isVideoPlaying) {
                    showControlButtons();
                }
            });
            
            // 鼠标离开按钮区域时隐藏
            controlButtons.addEventListener('mouseleave', function() {
                if (isVideoPlaying) {
                    // 立即隐藏
                    controlButtons.classList.remove('visible');
                }
            });
        }
        
        // 视频播放状态改变时更新按钮可见性
        const originalStopVideo = stopVideo;
        stopVideo = function() {
            // 调用原始函数
            originalStopVideo();
            
            // 更新按钮状态（此时 isVideoPlaying 已变为 false）
            updateControlButtonsState();
        };
        
        // 初始化按钮状态
        updateControlButtonsState();
    </script>
</body>
</html>
