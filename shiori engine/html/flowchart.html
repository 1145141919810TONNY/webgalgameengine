<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧本流程图导航(API版)</title>
    <link rel="icon" type="image/png" href="../icon/icon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('../assets/cg/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: auto;
            min-height: 100vh;
        }
        
        /* 顶部导航栏 */
        .actions {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            text-align: center;
            margin: 0;
            padding: 10px;
            border: none;
            border-bottom: 1px solid #FFD700;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        button {
            background-color: transparent;
            color: #FFD700;
            padding: 8px 16px;
            border: 2px solid #FFD700;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: 2px solid #FFA500;
            transform: scale(1.05);
        }
        
        button.primary {
            background-color: rgba(33, 150, 243, 0.3);
            border-color: #2196F3;
            color: #fff;
        }
        
        button.primary:hover {
            background-color: rgba(33, 150, 243, 0.5);
            border-color: #1976D2;
        }
        
        /* 标题 */
        h1 {
            text-align: center;
            color: #FFD700;
            font-size: 28px;
            margin: 80px auto 30px auto;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            letter-spacing: 3px;
            width: fit-content;
        }
        
        /* 流程图容器 */
        #flowchart-container {
            position: relative;
            padding: 40px;
            overflow: visible;
            min-width: 100%;
        }
        
        /* SVG 连线层 */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }
        
        /* 节点样式 - 金色主题 */
        .node {
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 165, 0, 0.15));
            border: 2px solid #FFD700;
            border-radius: 20px;
            color: #FFD700;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            padding: 10px 22px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.25);
            user-select: none;
            min-width: 70px;
            text-align: center;
        }
        
        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.45);
            border-color: #FFA500;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 165, 0, 0.25));
            color: #FFA500;
        }
        
        /* 未解锁节点样式 - 灰色禁用 */
        .node.locked {
            border-color: #999;
            background: linear-gradient(135deg, rgba(150, 150, 150, 0.15), rgba(130, 130, 130, 0.15));
            color: #bbb;
            cursor: not-allowed;
            opacity: 0.75;
            box-shadow: 0 2px 8px rgba(100, 100, 100, 0.15);
        }
        
        .node.locked:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 100, 100, 0.25);
            border-color: #aaa;
            background: linear-gradient(135deg, rgba(150, 150, 150, 0.2), rgba(130, 130, 130, 0.2));
            color: #ccc;
        }
        
        /* 合并节点样式 - 蓝色高亮 */
        .node.merge-node {
            border-color: #2196F3;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.15), rgba(25, 118, 210, 0.15));
            color: #2196F3;
        }
        
        .node.merge-node:hover {
            border-color: #1976D2;
            box-shadow: 0 8px 30px rgba(33, 150, 243, 0.5);
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.25), rgba(25, 118, 210, 0.25));
            color: #1976D2;
        }
        
        /* 合并节点但未解锁 */
        .node.merge-node.locked {
            border-color: #888;
            background: linear-gradient(135deg, rgba(130, 130, 130, 0.15), rgba(110, 110, 110, 0.15));
            color: #aaa;
            box-shadow: 0 2px 8px rgba(80, 80, 80, 0.15);
        }
        
        /* 当前游玩场景高亮 */
        .node.current-playing {
            border: 3px solid #2196F3 !important;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.8), inset 0 0 10px rgba(33, 150, 243, 0.3) !important;
            animation: pulse-blue 2s ease-in-out infinite;
        }
        
        @keyframes pulse-blue {
            0%, 100% {
                box-shadow: 0 0 20px rgba(33, 150, 243, 0.8), inset 0 0 10px rgba(33, 150, 243, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(33, 150, 243, 1), inset 0 0 15px rgba(33, 150, 243, 0.5);
            }
        }
        
        /* 连线样式 */
        path.link-line {
            fill: none;
            stroke: #FFD700;
            stroke-width: 2;
            opacity: 0.75;
        }
        
        path.link-line.merge-line {
            stroke: #2196F3;
            opacity: 0.7;
        }
        
        polygon.arrow {
            fill: #FFD700;
        }
        
        polygon.arrow.merge-arrow {
            fill: #2196F3;
        }
        
        /* 智能返回提示框 */
        #smart-return-box {
            position: fixed;
            top: 80px;
            right: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 20px;
            z-index: 1500;
            display: none;
            min-width: 280px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
            animation: slideInRight 0.3s ease;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        #return-message {
            color: #2196F3;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        
        #return-button {
            width: 100%;
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.4), rgba(25, 118, 210, 0.4));
            border: 2px solid #2196F3;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        #return-button:hover {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.6), rgba(25, 118, 210, 0.6));
            border-color: #1976D2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 1366px) and (max-height: 768px) {
            h1 {
                font-size: 24px;
                margin-top: 70px;
            }
            
            .node {
                font-size: 13px;
                padding: 8px 18px;
            }
            
            button {
                font-size: 13px;
                padding: 6px 14px;
            }
        }
        
        @media (max-width: 1280px) and (max-height: 720px) {
            h1 {
                font-size: 22px;
            }
            
            .node {
                font-size: 12px;
                padding: 7px 16px;
            }
            
            button {
                font-size: 12px;
                padding: 5px 12px;
            }
        }
        
        @media (max-width: 800px) {
            h1 {
                font-size: 20px;
            }
            
            .node {
                font-size: 11px;
                padding: 6px 14px;
            }
            
            button {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
        
        @media (max-height: 500px) {
            h1 {
                font-size: clamp(1rem, 3vw, 1.25rem);
                margin: clamp(3rem, 6vh, 3.75rem) auto clamp(1rem, 2vh, 1.5rem) auto;
            }
            
            .actions {
                padding: clamp(0.3rem, 0.8vh, 0.5rem);
            }
            
            button {
                font-size: clamp(0.6rem, 1.6vw, 0.75rem);
                padding: clamp(0.2rem, 0.5vh, 0.35rem) clamp(0.4rem, 1vw, 0.6rem);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="actions">
        <button onclick="location.href='archive.html'">存档管理</button>
        <button onclick="location.href='saves.html'" class="primary">进度管理</button>
        <button onclick="location.href='../index.html'" class="back">返回主菜单(esc)</button>
    </div>
    
    <!-- 标题 -->
    <h1>剧本流程图导航(API版)</h1>
    
    <!-- 智能返回提示框 -->
    <div id="smart-return-box" style="display: none;">
        <div id="return-message"></div>
        <button id="return-button" onclick="handleSmartReturn()"></button>
    </div>
    
    <!-- 流程图容器 -->
    <div id="flowchart-container">
        <!-- SVG 连线将通过 JavaScript 动态生成 -->
    </div>
    
    <script>
        // ============================================================
        // 【正式版 - API数据源接入】
        // 本文件通过API接口读取游戏进度数据，动态解锁已访问的场景节点
        // 未解锁的场景显示为“？？？”，点击无效
        // 适用于：玩家实际游戏体验、进度追踪、成就系统
        // 
        // API接入说明：
        // - 数据来源：localStorage.gameProgress.sceneMarkers
        // - 解锁判断：visited === 1 或直接值为 1
        // - 实时同步：页面加载时读取最新进度，无需手动刷新
        // ============================================================
        // 
        // 剧本场景数据 - 硬编码的完整流程图结构（作为布局参考和兜底数据）
        // 
        // 【数据格式说明】
        // scenes数组中的每个对象代表一个场景节点，包含以下字段：
        // 
        // 必填字段：
        //   - id: 场景唯一标识符（字符串），建议使用层级编号如 "1", "2.1", "3.1.2"
        //         点号分隔表示层级关系，用于自动计算垂直位置
        //   - fileName: 对应的HTML场景文件名（不含扩展名），如 "scene1" 对应 scene1.html
        //               必须与 scenes/ 目录下的实际文件名一致
        //   - displayName: 节点显示文本，支持中文、英文、特殊符号
        //   - links: 子节点ID数组，定义从当前节点可以跳转到的场景
        //            空数组 [] 表示终点节点（如结局）
        // 
        // 可选字段：
        //   - x: 水平偏移百分比（数值），基准位置为画布中心(300px)
        //        正值向右移动，负值向左移动
        //        计算公式: 最终x = 300 + (x / 100) * 1800
        //        示例: x:-6 表示向左偏移6%画布宽度
        //   - y: 垂直偏移百分比（数值），基准位置由层级自动计算
        //        正值向下移动，负值向上移动
        //        计算公式: 最终y = 80 + 层级 * 126 + (y / 100) * 3000
        //        示例: y:-2.4 表示向上偏移2.4%画布高度
        //   - isMerge: 布尔值，标记是否为合并节点（多条路线汇聚点）
        //              设置为 true 时节点边框显示蓝色高亮
        //   - mergeSources: 字符串数组，仅当 isMerge=true 时使用
        //                   列出所有汇入该合并节点的父节点ID
        //                   用于绘制特殊的合并连线样式
        // 
        // 【布局规则】
        // 1. 垂直布局：系统根据id的点号层级自动分配Y轴位置
        //    - id:"1" -> 第1层, id:"2.1" -> 第2层, id:"3.1.2" -> 第3层
        //    - 每层间距固定为126px（节点高度46px + 间距80px）
        // 
        // 2. 水平布局：同一层级的节点按x值排序，自动碰撞检测
        //    - 如果未指定x，默认居中（x=0）
        //    - 如果节点重叠，系统会自动将右侧节点推开，最小间距160px
        //    - 建议手动调整x值避免过度拥挤
        // 
        // 3. 连线绘制：系统自动根据links绘制正交折线
        //    - 单对单连接：使用三段式路径（下-横-下）
        //    - 多对多连接：使用五段式路径避免交叉
        //    - 合并节点连线：使用蓝色特殊样式
        // 
        // 【命名建议】
        // - id使用数字层级：主线路用 "1", "2", "3"，分支用 "3.1", "3.2"，子分支用 "3.1.1"
        // - fileName与scenes目录下的HTML文件保持一致
        // - displayName简洁明了，过长文本会影响节点显示效果
        // - 合并节点displayName可标注来源，如 "4[3.1.2,3.2.1]"
        // 
        // 【调试技巧】
        // 1. 先定义主干剧情（无x/y偏移），确认层级正确
        // 2. 再添加分支路线，通过x值调整左右分布
        // 3. 最后微调y值处理特殊情况（如需要跨越层级的连线）
        // 4. 保存后刷新页面查看效果，反复调整直到布局满意
        // 
        // 【注意事项】
        // - links中的ID必须在scenes数组中存在对应的场景定义
        // - 避免循环引用（A->B->A），会导致无限递归
        // - 合并节点的mergeSources应与其实际父节点一致
        // - x/y值为百分比，不同屏幕尺寸下偏移量会按比例缩放
        // 
        // 【正式版与调试版区别】
        // 本文件为API版本（flowchart.html），会根据游戏进度自动解锁已访问的场景节点
        // 未解锁的场景显示为“？？？”，点击无效
        // 调试版（flowchart_debug.html）则显示所有节点，无论是否解锁
        // ============================================================

        /**
         * 场景示例数据，请根据实际情况修改
         * */
        const scenes = [
            // === 主线剧情 ===
            { id:"start",   fileName:"scene_start",     displayName:"故事开始",           links:["chapter1"] },
            { id:"chapter1",   fileName:"scene_ch1",      displayName:"第一章",           links:["branch_point"] },
            { id:"branch_point",   fileName:"scene_branch",   displayName:"关键抉择",     links:["route_a","route_b","route_c","route_d"] ,x:-0.8},
            
            // --- 路线A ---
            { id:"route_a", fileName:"scene_route_a",     displayName:"路线A·启程",    links:["route_a_1"], x:-6 },
            { id:"route_a_1",fileName:"scene_route_a2",    displayName:"A·遭遇挑战",      links:["route_a_2"], x:-5.6 ,y:-2.4},
            { id:"route_a_2",fileName:"scene_route_a3",    displayName:"A·暗流涌动",    links:["merge_point_1"], x:-6, y:-4.2 },

            // --- 路线B ---
            { id:"route_b", fileName:"scene_route_b",     displayName:"路线B·探索",    links:["route_b_1","route_b_2","route_b_3"], x:11.5 },
            { id:"route_b_1",fileName:"scene_route_b2a",   displayName:"B·发现线索",      links:["merge_point_1"], x:2.9},
            { id:"route_b_2",fileName:"scene_route_b2b",   displayName:"B·结识伙伴",        links:["merge_point_2"], x:3 },
            { id:"route_b_3",fileName:"scene_route_b2c",   displayName:"B·遭遇危机",        links:["merge_point_2"], x:5 },

            // --- 路线C & D ---
            { id:"route_c", fileName:"scene_route_c",     displayName:"路线C·正面突破",links:["merge_point_3"], x:37 },
            { id:"route_d", fileName:"scene_route_d",     displayName:"路线D·迂回策略",links:["merge_point_3"], x:32 },

            // === 合并节点 ===
            { id:"merge_point_1",   fileName:"scene_merge1",      displayName:"汇聚点一", links:["act2_start"], isMerge:true,
                mergeSources:["route_a_2","route_b_1"], x:-6, y:1 },
            { id:"act2_start",   fileName:"scene_act2",   displayName:"第二幕·转折",    links:["merge_final_1","ending_neutral"], x:3.1 ,y:-0.08 },

            { id:"merge_point_2",   fileName:"scene_merge2",      displayName:"汇聚点二", links:["act2_mid"], isMerge:true,
                mergeSources:["route_b_2","route_b_3"], x:7 },
            { id:"act2_mid",   fileName:"scene_act2mid",     displayName:"第二幕·高潮",    links:["merge_final_1","ending_neutral"], x:3.1 },

            { id:"merge_point_3",  fileName:"scene_merge3",     displayName:"汇聚点三",    links:["climax_a","climax_b"], isMerge:true,
                mergeSources:["route_c","route_d"], x:35 },
            { id:"climax_a",fileName:"scene_climax_a",     displayName:"高潮·决战A",    links:["merge_point_4"], x:30 },
            { id:"climax_b",fileName:"scene_climax_b",     displayName:"高潮·决战B",    links:["merge_point_4"], x:40 },

            { id:"merge_point_4",  fileName:"scene_merge4",     displayName:"汇聚点四",  links:["ending_special"], isMerge:true,
                mergeSources:["climax_a","climax_b"], x:35 },
            { id:"ending_special",  fileName:"scene_ending_sp",displayName:"特殊结局",   links:["ending_neutral"], x:35.5 ,y:-1.5 },

            // === 最终结局 ===
            { id:"merge_final_1",   fileName:"scene_merge_f1",      displayName:"最终汇聚",         links:["ending_good"], isMerge:true,
                mergeSources:["act2_start","act2_mid"], x:3.85 ,y:1},
            { id:"ending_good",   fileName:"scene_ending_g",  displayName:"美好结局",    links:[], x:3 },

            { id:"ending_neutral",  fileName:"scene_ending_n",     displayName:"普通结局",       links:["ending_true"], isMerge:true,
                mergeSources:["act2_mid","ending_special"], x:5 ,y:1},
            { id:"ending_true",  fileName:"scene_ending_t",  displayName:"真结局",    links:[], x:6 }
        ];
        
        // 构建查找表
        const sceneMap = {};
        scenes.forEach(s => sceneMap[s.id] = s);
        
        // 构建反向查找（子节点 -> 父节点列表）
        const parentOf = {};
        scenes.forEach(s => {
            (s.links || []).forEach(lid => {
                if (!parentOf[lid]) parentOf[lid] = [];
                if (!parentOf[lid].includes(s.id)) parentOf[lid].push(s.id);
            });
        });
        
        // ============================================================
        // API 数据源 - 从 localStorage 获取已解锁场景
        // 功能：读取游戏进度数据，判断哪些场景已经解锁
        // ============================================================
        
        /**
         * 获取所有已解锁的场景ID集合
         * 从localStorage的gameProgress中读取sceneMarkers，提取已访问的场景
         * @returns {Set} 已解锁场景ID的集合，如 Set(["scene1", "scene2"])
         */
        function getUnlockedScenes() {
            try {
                const progressData = localStorage.getItem('gameProgress');
                if (!progressData) {
                    console.log('[API] No progress data found');
                    return new Set();  // 没有进度数据，返回空集合
                }
                
                const progress = JSON.parse(progressData);  // 解析JSON
                const unlockedSet = new Set();  // 创建集合存储已解锁场景
                
                // 从 sceneMarkers 中提取已访问的场景
                if (progress.sceneMarkers) {
                    Object.keys(progress.sceneMarkers).forEach(marker => {
                        const value = progress.sceneMarkers[marker];
                        // 兼容新旧格式：新格式{visited: 1, ...} 或 旧格式直接为1
                        if ((typeof value === 'object' && value.visited === 1) || value === 1) {
                            unlockedSet.add(marker);  // 添加到集合
                        }
                    });
                }
                
                console.log('[API] Unlocked scenes:', Array.from(unlockedSet));
                return unlockedSet;
            } catch (e) {
                console.error('[API] Failed to load progress:', e);
                return new Set();  // 加载失败返回空集合
            }
        }
        
        /**
         * 检查指定场景是否已解锁
         * @param {string} sceneId - 场景fileName，如 "scene1"
         * @returns {boolean} 是否已解锁
         */
        function isSceneUnlocked(sceneId) {
            const unlockedScenes = getUnlockedScenes();
            return unlockedScenes.has(sceneId);  // 检查集合中是否包含该场景
        }
        
        // ============================================================
        // 布局引擎 - 从上到下的层级布局
        // 功能：根据场景数据中的x/y百分比偏移量，计算每个节点在画布上的绝对位置
        // 
        // 【x/y 基准值调节指南】
        // 如需精确调整节点位置的每一份偏移量，请修改以下常量：
        // 
        // 1. X轴基准参数：
        //    - canvasW: 虚拟画布宽度（默认1800）
        //      * 作用：决定场景中x百分比偏移的实际像素值
        //      * 计算公式：实际偏移 = (x / 100) * canvasW
        //      * 示例：canvasW=1800时，x=1 表示向右偏移18px
        //      * 调整建议：增大canvasW会使相同的x值产生更大的水平位移
        // 
        //    - x坐标基准值(300): 在computeLayout函数中定义
        //      * 位置：查找代码 `x: 300 + (xPct / 100) * canvasW`
        //      * 作用：所有节点的x轴起始位置（画布中心偏左）
        //      * 调整建议：增大该值整体右移，减小则左移
        // 
        // 2. Y轴基准参数：
        //    - canvasH: 虚拟画布高度（默认3000）
        //      * 作用：决定场景中y百分比偏移的实际像素值
        //      * 计算公式：实际偏移 = (y / 100) * canvasH
        //      * 示例：canvasH=3000时，y=1 表示向下偏移30px
        //      * 调整建议：增大canvasH会使相同的y值产生更大的垂直位移
        // 
        //    - NODE_H: 节点高度（默认46px）
        //      * 作用：每个场景节点的固定高度
        //      * 影响：改变节点本身的大小
        // 
        //    - GAP_Y: 节点垂直间距（默认80px）
        //      * 作用：相邻层级之间的基础间距
        //      * 计算公式：层级间距 = NODE_H + GAP_Y = 126px
        //      * 调整建议：增大GAP_Y会使层级之间更疏远
        // 
        //    - y坐标基准值(80): 在computeLayout函数中定义
        //      * 位置：查找代码 `y: 80 + lvl * (NODE_H + GAP_Y) + (yPct / 100) * canvasH`
        //      * 作用：第一层节点的顶部边距
        //      * 调整建议：增大该值整体下移，减小则上移
        // 
        // 3. 调节示例：
        //    如果想让x=1的偏移从18px变为25px：
        //    - 将 canvasW 从 1800 改为 2500
        //    
        //    如果想让层级间距从126px变为150px：
        //    - 将 GAP_Y 从 80 改为 104（因为 NODE_H=46 不变）
        //    
        //    如果想让整体布局向右平移100px：
        //    - 查找代码 `x: 300 + (xPct / 100) * canvasW`，将其中的 300 改为 400
        // 
        // 4. 注意事项：
        //    - 修改后需刷新页面查看效果
        //    - canvasW/canvasH 影响所有节点的偏移比例
        //    - 基准值(300/80) 影响整体位置平移
        //    - NODE_H/GAP_Y 影响节点大小和层级间距
        // ============================================================
        const NODE_W = 120, NODE_H = 46;  // 节点宽度和高度（像素）
        const GAP_Y = 80;  // 节点之间的垂直间距
        const canvasW = 1800;  // 虚拟画布宽度，用于计算x轴百分比偏移
        const canvasH = 3000;  // 虚拟画布高度，用于计算y轴百分比偏移
        
        /**
         * 获取场景ID的深度层级（通过点号分隔的段数）
         * @param {string} id - 场景ID，如 "3.1.2"
         * @returns {number} 深度层级，如 3
         */
        function getDepth(id) { return id.split('.').length; }
        
        // 使用广度优先搜索(BFS)算法为每个场景分配Y轴层级
        // 从根节点开始，逐层遍历所有子节点
        const levels = {};  // 存储每个层级的场景ID列表，如 {0: ["1"], 1: ["2"], ...}
        const nodeLevel = {};  // 存储每个场景ID对应的层级，如 {"1": 0, "2": 1, ...}
        let maxLevel = -1;  // 记录最大层级数
        
        /**
         * 自动分配场景层级函数（立即执行）
         * 使用BFS算法从根节点开始遍历，为每个场景分配层级
         */
        (function assignLevels() {
            const queue = [{id: scenes[0].id, lvl: 0}];  // BFS队列，从第一个场景开始
            const visited = new Set();  // 已访问集合，避免重复处理
            while (queue.length) {
                const {id, lvl} = queue.shift();  // 取出队列头部元素
                if (visited.has(id)) continue;  // 跳过已访问的节点
                visited.add(id);  // 标记为已访问
                if (!levels[lvl]) levels[lvl] = [];  // 初始化当前层级数组
                levels[lvl].push(id);  // 将场景ID添加到对应层级
                nodeLevel[id] = lvl;  // 记录场景的层级
                maxLevel = Math.max(maxLevel, lvl);  // 更新最大层级
                const sc = sceneMap[id];
                if (sc && sc.links) {
                    // 将所有子节点加入队列，层级+1
                    sc.links.forEach(lid => queue.push({id: lid, lvl: lvl + 1}));
                }
            }
        })();
        
        const nodePos = {};  // 存储每个场景节点的最终位置 {id: {x, y}}
        
        /**
         * 计算布局函数（立即执行）
         * 分两步：1.根据数据中的x/y百分比偏移量计算初始位置
         *        2.碰撞检测，将同一层级中重叠的节点推开
         */
        (function computeLayout() {
            // 步骤1: 根据数据中的 x/y 百分比偏移量分配节点位置
            // x坐标 = 基准值(300) + 百分比偏移 * 画布宽度
            // y坐标 = 基准值(80) + 层级 * (节点高度+间距) + 百分比偏移 * 画布高度
            for (let lvl = 0; lvl <= maxLevel; lvl++) {
                const ids = levels[lvl] || [];
                ids.forEach(id => {
                    const sc = sceneMap[id];
                    const xPct = (sc && sc.x != null) ? sc.x : 0;  // x轴百分比偏移，默认0
                    const yPct = (sc && sc.y != null) ? sc.y : 0;  // y轴百分比偏移，默认0
                    nodePos[id] = {
                        x: 300 + (xPct / 100) * canvasW,  // 计算x坐标
                        y: 80 + lvl * (NODE_H + GAP_Y) + (yPct / 100) * canvasH  // 计算y坐标
                    };
                });
            }
            
            // 步骤2: 碰撞检测与解决 - 将同一层级中重叠的节点向右推开
            for (let lvl = 0; lvl <= maxLevel; lvl++) {
                const ids = levels[lvl] || [];
                // 按x坐标从小到大排序
                const sorted = ids.slice().sort((a, b) => nodePos[a].x - nodePos[b].x);
                const minGap = NODE_W + 40;  // 节点之间最小间距（节点宽度+40px）
                for (let i = 1; i < sorted.length; i++) {
                    const prev = nodePos[sorted[i - 1]];
                    const curr = nodePos[sorted[i]];
                    const overlap = (prev.x + minGap) - curr.x;  // 计算重叠量
                    if (overlap > 0) {
                        // 如果有重叠，将当前节点推到前一个节点右侧
                        curr.x = prev.x + minGap;
                    }
                }
            }
        })();
        
        // ============================================================
        // 渲染流程图 - 创建DOM节点和SVG连线
        // 功能：根据计算好的节点位置，创建HTML元素和SVG连线
        // ============================================================
        const container = document.getElementById('flowchart-container');  // 流程图容器
        const svgNS = "http://www.w3.org/2000/svg";  // SVG命名空间
        const svg = document.createElementNS(svgNS, "svg");  // 创建SVG元素
        svg.setAttribute("id", "connections");  // 设置SVG ID
        container.appendChild(svg);  // 将SVG添加到容器中
        
        // 创建所有场景节点DOM元素
        Object.keys(nodePos).forEach(id => {
            const sc = sceneMap[id];
            if (!sc) return;  // 跳过无效场景
            const pos = nodePos[id];
            const div = document.createElement('div');  // 创建节点div
            div.className = 'node';  // 设置基础样式类
            div.id = 'node-' + id.replace(/\./g, '_');  // 设置唯一ID，将点号替换为下划线
            div.style.left = pos.x + 'px';  // 设置x坐标
            div.style.top = pos.y + 'px';  // 设置y坐标
            
            // 检查场景是否已解锁，决定显示内容和样式
            const unlocked = isSceneUnlocked(sc.fileName);
            
            if (unlocked) {
                // 已解锁：显示正常名称
                div.innerHTML = `<span>${sc.displayName}</span>`;
            } else {
                // 未解锁：显示“？？？”，添加locked样式类
                div.classList.add('locked');
                div.innerHTML = `<span>？？？</span>`;
            }
            
            // 如果是合并节点，添加相应样式
            if (sc.isMerge) {
                div.classList.add('merge-node');
            }
            
            div.title = `${sc.id} | ${sc.fileName}`;  // 设置鼠标悬停提示
            
            // 点击事件：仅当已解锁时可跳转
            if (unlocked) {
                div.onclick = function() {
                    jumpToScene(sc.fileName + '.html');
                };
            } else {
                div.onclick = function() {
                    console.log('[API] Scene locked:', sc.fileName);  // 锁定状态仅输出日志
                };
            }
            
            container.appendChild(div);  // 将节点添加到容器
        });
        
        /**
         * 判断是否为简单链接（单对单关系）
         * 简单链接的定义：父节点只有一个子节点，且子节点只有一个父节点
         * 这种链接可以使用简化的路径绘制（三段式：下-横-下）
         * @param {string} fromId - 起始节点ID
         * @param {string} toId - 目标节点ID
         * @returns {boolean} 是否为简单链接
         */
        function isSimpleLink(fromId, toId) {
            const from = sceneMap[fromId];
            const to = sceneMap[toId];
            return from.links.length === 1 && (!parentOf[toId] || parentOf[toId].length === 1);
        }
        
        /**
         * 绘制所有节点之间的连线
         * 使用SVG path元素绘制贝塞尔曲线或折线
         * 根据链接类型（简单/复杂、合并/普通）使用不同的样式和路径
         */
        function drawConnections() {
            // 计算SVG画布尺寸 - 遍历所有节点找到最大边界
            let maxX = 800, maxY = 600;
            Object.keys(nodePos).forEach(id => {
                const p = nodePos[id];
                if (p.x + NODE_W > maxX) maxX = p.x + NODE_W + 200;  // 右边界+200px边距
                if (p.y + NODE_H > maxY) maxY = p.y + NODE_H + 200;  // 下边界+200px边距
            });
            svg.setAttribute('width', maxX);  // 设置SVG宽度
            svg.setAttribute('height', maxY);  // 设置SVG高度
            container.style.minWidth = (maxX + 80) + 'px';  // 设置容器最小宽度
            container.style.minHeight = (maxY + 80) + 'px';  // 设置容器最小高度
            svg.innerHTML = '';  // 清空现有连线
            
            // 遍历所有场景，绘制从该场景出发的所有连线
            scenes.forEach(sc => {
                if (!sc.links) return;  // 跳过没有子节点的场景
                const fromEl = document.getElementById('node-' + sc.id.replace(/\./g, '_'));
                if (!fromEl) return;  // 跳过不存在的节点
                // 获取起始节点的 bounding rect（相对于视口）
                const fromRect = fromEl.getBoundingClientRect();
                const contRect = container.getBoundingClientRect();  // 容器的 bounding rect
                // 计算起始点坐标（相对于容器）：节点底部中心
                const x1 = fromRect.left - contRect.left + fromRect.width / 2;
                const y1 = fromRect.bottom - contRect.top;
                
                // 遍历所有子节点，绘制连线
                sc.links.forEach(tid => {
                    const toEl = document.getElementById('node-' + tid.replace(/\./g, '_'));
                    if (!toEl) return;  // 跳过不存在的节点
                    // 获取目标节点的 bounding rect
                    const toRect = toEl.getBoundingClientRect();
                    // 计算终点坐标（相对于容器）：节点顶部中心
                    const x2 = toRect.left - contRect.left + toRect.width / 2;
                    const y2 = toRect.top - contRect.top;
                    
                    // 判断是否为合并节点连线，使用不同样式
                    const isMerge = sceneMap[tid] && sceneMap[tid].isMerge;
                    const lineClass = isMerge ? 'link-line merge-line' : 'link-line';
                    const arrowClass = isMerge ? 'arrow merge-arrow' : 'arrow';
                    
                    // 根据情况选择不同的连线路径
                    let pathData;
                    if (Math.abs(x1 - x2) < 3) {
                        // 情况1：垂直直线（起点和终点x坐标几乎相同）
                        pathData = `M ${x1} ${y1} L ${x2} ${y2}`;
                    } else if (isSimpleLink(sc.id, tid)) {
                        // 情况2：简单路径（单对单关系）- 三段式：下-横-下
                        const midY = y1 + (y2 - y1) * 0.5;  // 中点y坐标
                        pathData = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
                    } else {
                        // 情况3：复杂路由（多对多关系）- 五段式，避免与其他线重叠
                        const gap = (y2 - y1);  // 垂直距离
                        const topSeg = gap * 0.3;  // 上段占30%
                        const botSeg = gap * 0.3;  // 下段占30%
                        const midY1 = y1 + topSeg;  // 第一个转折点y坐标
                        const midY2 = y2 - botSeg;  // 第二个转折点y坐标
                        pathData = `M ${x1} ${y1} L ${x1} ${midY1} L ${x2} ${midY1} L ${x2} ${midY2} L ${x2} ${y2}`;
                    }
                    
                    // 创建SVG path元素并设置属性
                    const path = document.createElementNS(svgNS, 'path');
                    path.setAttribute('d', pathData);  // 设置路径数据
                    path.setAttribute('class', lineClass);  // 设置样式类
                    svg.appendChild(path);  // 添加到SVG
                    
                    // 创建箭头（三角形）
                    const arrow = document.createElementNS(svgNS, 'polygon');
                    const aw = 7, ah = 9;  // 箭头宽度7px，高度9px
                    // 定义三角形三个顶点坐标
                    arrow.setAttribute('points', `${x2-aw},${y2-ah} ${x2+aw},${y2-ah} ${x2},${y2}`);
                    arrow.setAttribute('class', arrowClass);  // 设置样式类
                    svg.appendChild(arrow);  // 添加到SVG
                });
            });
        }
        
        /**
         * 跳转到指定场景页面
         * @param {string} sceneFileName - 场景文件名（不含路径），如 "scene1.html"
         */
        function jumpToScene(sceneFileName) {
            window.location.href = '../scenes/' + sceneFileName;  // 跳转到scenes目录下的场景文件
        }
        
        // ============================================================
        // 智能返回功能管理器
        // 功能：当用户从剧情页面进入流程图时，显示“返回当前页面”按钮
        //       并高亮显示当前正在游玩的场景节点
        // ============================================================
        const SmartReturnManager = {
            /**
             * 初始化智能返回功能
             */
            init: function() {
                this.checkAndDisplayReturnBox();
            },
            
            /**
             * 检查是否显示智能返回提示框
             * 判断逻辑：如果sessionStorage中有gameStateSnapshot，且来自剧情页面（非主菜单），则显示
             */
            checkAndDisplayReturnBox: function() {
                console.log('[Smart Return] checkAndDisplayReturnBox called');
                
                const snapshot = this.loadStateSnapshot();  // 加载状态快照
                console.log('[Smart Return] Snapshot:', snapshot);
                
                const box = document.getElementById('smart-return-box');
                const messageEl = document.getElementById('return-message');
                const buttonEl = document.getElementById('return-button');
                
                if (!box || !messageEl || !buttonEl) {
                    console.error('[Smart Return] DOM elements not found!');
                    return;
                }
                
                // 只处理从剧情页进入的情况（pagePath包含/scenes/且不包含index.html）
                if (snapshot && !snapshot.pagePath.includes('index.html') && snapshot.pagePath.includes('/scenes/')) {
                    console.log('[Smart Return] From story page');
                    messageEl.textContent = '当前游玩页面';  // 设置提示文本
                    buttonEl.textContent = '返回当前页面';  // 设置按钮文本
                    
                    // 保存返回目标信息到sessionStorage
                    sessionStorage.setItem('returnTarget', JSON.stringify({
                        type: 'current',  // 类型为当前页面
                        url: snapshot.pageUrl,  // 页面URL
                        line: snapshot.currentLine  // 当前行号
                    }));
                    
                    box.style.display = 'block';  // 显示提示框
                    console.log('[Smart Return] Showed return box');
                    
                    // 高亮当前游玩的场景节点
                    this.highlightCurrentScene(snapshot);
                } else {
                    // 从主菜单进入或没有snapshot，隐藏提示框
                    console.log('[Smart Return] From main menu or no snapshot, hiding box');
                    box.style.display = 'none';
                }
            },
            
            /**
             * 从sessionStorage加载游戏状态快照
             * @returns {Object|null} 状态快照对象，包含pagePath、pageUrl、currentLine等信息
             */
            loadStateSnapshot: function() {
                try {
                    const snapshotStr = sessionStorage.getItem('gameStateSnapshot');
                    if (snapshotStr) {
                        return JSON.parse(snapshotStr);  // 解析JSON字符串
                    }
                } catch (e) {
                    console.error('[Smart Return] Failed to load snapshot:', e);
                }
                return null;  // 加载失败返回null
            },
            
            /**
             * 高亮显示当前正在游玩的场景节点
             * 通过比对snapshot中的pagePath和场景数据，找到对应节点并添加current-playing类
             * @param {Object} snapshot - 游戏状态快照对象
             */
            highlightCurrentScene: function(snapshot) {
                this.clearAllHighlights();  // 先清除所有高亮
                
                const pathParts = snapshot.pagePath.split('/');  // 分割路径
                const sceneFileName = pathParts[pathParts.length - 1];  // 获取文件名，如 "scene1.html"
                const sceneIdWithoutExt = sceneFileName.replace('.html', '');  // 去除扩展名，如 "scene1"
                
                // 查找对应的场景数据（通过fileName匹配）
                let targetSceneId = null;
                scenes.forEach(sc => {
                    if (sc.fileName === sceneIdWithoutExt) {
                        targetSceneId = sc.id;  // 找到匹配的场景ID
                    }
                });
                
                if (targetSceneId) {
                    // 构建节点DOM ID（将点号替换为下划线）
                    const nodeId = 'node-' + targetSceneId.replace(/\./g, '_');
                    const node = document.getElementById(nodeId);
                    if (node) {
                        node.classList.add('current-playing');  // 添加高亮样式类
                        console.log('[Smart Return] Highlighted current playing scene:', sceneFileName, 'nodeId:', nodeId);
                    }
                }
            },
            
            /**
             * 清除所有节点的高亮样式
             */
            clearAllHighlights: function() {
                const nodes = document.querySelectorAll('.node');  // 获取所有节点
                nodes.forEach(node => {
                    node.classList.remove('current-playing');  // 移除高亮类
                });
            }
        };
        
        /**
         * 处理智能返回按钮点击事件
         * 从sessionStorage中读取returnTarget，构造带startLine参数的URL并跳转
         */
        function handleSmartReturn() {
            const returnTargetStr = sessionStorage.getItem('returnTarget');
            if (!returnTargetStr) {
                console.warn('[Smart Return] No return target found');
                return;
            }
            
            try {
                const returnTarget = JSON.parse(returnTargetStr);  // 解析返回目标
                console.log('[Smart Return] Return target:', returnTarget);
                
                if (returnTarget.type === 'current') {
                    // 构造带行号参数的URL
                    const url = new URL(returnTarget.url, window.location.origin);
                    url.searchParams.set('startLine', returnTarget.line);  // 添加startLine参数
                    console.log('[Smart Return] Returning to current scene:', url.toString());
                    window.location.href = url.toString();  // 跳转到目标URL
                }
            } catch (e) {
                console.error('[Smart Return] Failed to process return:', e);
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[Flowchart API Page] DOMContentLoaded triggered');
            
            // 使用双重requestAnimationFrame确保DOM完全渲染后再绘制连线
            requestAnimationFrame(() => {
                requestAnimationFrame(drawConnections);
            });
            
            // 延迟100ms初始化智能返回功能，确保DOM完全就绪
            setTimeout(() => {
                SmartReturnManager.init();
                console.log('[Flowchart API Page] SmartReturnManager initialized');
            }, 100);
        });
        
        // 窗口resize事件处理 - 防抖重新绘制连线
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);  // 清除之前的定时器
            resizeTimer = setTimeout(drawConnections, 150);  // 150ms后重新绘制
        });
        
        // ESC键监听 - 按下ESC返回主菜单
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
