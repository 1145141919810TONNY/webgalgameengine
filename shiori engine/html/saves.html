<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>游戏进度管理</title>
		<link rel="icon" type="image/png" href="../icon/icon-32.png">
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 0;
				height: 100vh;
				overflow: hidden;
				position: relative;
				background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../assets/cg/bg.jpg') center center/cover no-repeat;
				display: flex;
				justify-content: center;
			}

			.container {
				width: 75%;
				margin-top: 70px;
				/* 为固定顶部菜单留出空间 */
				margin-left: auto;
				margin-right: auto;
				background: transparent;
				padding: 15px;
				border-radius: 8px;
				box-shadow: none;
			}

			h1 {
				color: #FFD700;
				text-align: center;
				margin: 40px auto 20px auto;
				font-size: 32px;
				text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
				width: fit-content;
			}

			.jump-section {
				margin: 15px 0;
			}

			h2 {
				margin: 20px auto 15px auto;
				color: #FFD700;
				font-size: 18px;
				text-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
				width: fit-content;
				text-align: center;
			}

			.scene-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 10px;
				margin-bottom: 20px;
				justify-content: center;
			}

			.scene-card {
				background-color: transparent;
				color: #FFD700;
				border: 2px solid #FFD700;
				border-radius: 20px;
				padding: 8px 15px;
				text-align: center;
				min-height: 40px;
				display: flex;
				flex-direction: column;
				justify-content: center;
				cursor: pointer;
				transition: all 0.3s ease;
				font-size: 16px;
				font-weight: bold;
			}

			.scene-card:hover {
				background-color: rgba(255, 215, 0, 0.2);
				color: #FFA500;
				border: 2px solid #FFA500;
				transform: scale(1.03);
			}



			/* 当前游玩场景高亮样式 */
			.current-playing-highlight {
				border: 3px solid #2196F3 !important;
				box-shadow: 0 0 15px rgba(33, 150, 243, 0.6), inset 0 0 10px rgba(33, 150, 243, 0.2) !important;
				background-color: rgba(33, 150, 243, 0.15) !important;
				position: relative;
				animation: pulse-blue 2s ease-in-out infinite;
			}

			.current-playing-highlight::before {
				content: '当前位置';
				position: absolute;
				top: -12px;
				right: 10px;
				background: linear-gradient(135deg, #2196F3, #1976D2);
				color: #fff;
				padding: 2px 10px;
				border-radius: 10px;
				font-size: 11px;
				font-weight: bold;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
				z-index: 10;
			}

			.current-playing-highlight:hover {
				background-color: rgba(33, 150, 243, 0.25) !important;
				border-color: #1976D2 !important;
			}


			/* 蓝色脉冲动画 */
			@keyframes pulse-blue {

				0%,
				100% {
					box-shadow: 0 0 15px rgba(33, 150, 243, 0.6), inset 0 0 10px rgba(33, 150, 243, 0.2);
				}

				50% {
					box-shadow: 0 0 25px rgba(33, 150, 243, 0.9), inset 0 0 15px rgba(33, 150, 243, 0.4);
				}
			}

			.actions {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				z-index: 1000;
				text-align: center;
				margin: 0;
				padding: 10px;
				border: none;
				border-bottom: 1px solid #FFD700;
				background-color: transparent;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 10px;
			}

			.container {
				width: 75%;
				margin-top: 70px;
				/* 为固定顶部菜单留出空间 */
				margin-left: auto;
				margin-right: auto;
				background: transparent;
				padding: 15px;
				border-radius: 8px;
				box-shadow: none;
				overflow-y: auto;
				/* 添加垂直滚动支持 */
				max-height: calc(100vh - 90px);
				/* 限制最大高度，留出顶部和底部空间 */
			}

			button {
				background-color: transparent;
				color: #FFD700;
				padding: 8px 16px;
				border: 2px solid #FFD700;
				border-radius: 20px;
				cursor: pointer;
				margin: 0 5px;
				font-size: 14px;
				font-weight: bold;
				transition: all 0.3s ease;
			}

			button:hover {
				background-color: rgba(255, 215, 0, 0.2);
				color: #FFA500;
				border: 2px solid #FFA500;
			}

			button.delete {
				color: #f44336;
				border: 2px solid #f44336;
			}

			button.delete:hover {
				background-color: rgba(244, 67, 54, 0.2);
				color: #da190b;
				border: 2px solid #da190b;
			}

			button.primary {
				background-color: rgba(33, 150, 243, 0.3);
				border-color: #2196F3;
				color: #fff;
			}

			button.primary:hover {
				background-color: rgba(33, 150, 243, 0.5);
				border-color: #1976D2;
			}

			.status {
				margin-top: 10px;
				padding: 8px;
				border-radius: 4px;
				text-align: center;
				font-size: 14px;
			}

			.success {
				background-color: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.error {
				background-color: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}

			/* 隐藏游戏相关元素 */
			#background-container,
			#character-container,
			#text-box-container,
			#options-container,
			#novel-mode-container {
				display: none;
			}

			/* 音频播放器保持隐藏 */
			audio {
				display: none;
			}

			/* ========================================
           响应式设计 - 小屏幕适配
           ======================================== */

			/* 小屏幕适配（1366x768） */
			@media (max-width: 1366px) and (max-height: 768px) {
				h1 {
					font-size: 28px;
				}

				h2 {
					font-size: 16px;
				}

				.scene-card {
					font-size: 15px;
					padding: 7px 13px;
					min-height: 38px;
				}

				button {
					font-size: 13px;
					padding: 6px 14px;
				}
			}

			/* 更小屏幕适配（1280x720） */
			@media (max-width: 1280px) and (max-height: 720px) {
				h1 {
					font-size: 24px;
				}

				h2 {
					font-size: 15px;
				}

				.scene-card {
					font-size: 14px;
					padding: 6px 12px;
					min-height: 36px;
				}

				button {
					font-size: 12px;
					padding: 5px 12px;
				}
			}

			/* 极小屏幕适配（<800px） */
			@media (max-width: 800px) {
				.container {
					width: 95%;
				}

				.scene-grid {
					grid-template-columns: repeat(2, 1fr);
				}

				h1 {
					font-size: 20px;
				}

				h2 {
					font-size: 14px;
				}

				.scene-card {
					font-size: 13px;
					padding: 5px 10px;
					min-height: 32px;
				}
			}

			/* 超小高度适配（高度<500px） */
			@media (max-height: 500px) {
				.container {
					margin-top: clamp(2.5rem, 5vh, 3.125rem);
					max-height: calc(100vh - clamp(4rem, 8vh, 5rem));
				}

				h1 {
					font-size: clamp(1rem, 3vw, 1.125rem);
					margin: clamp(0.5rem, 1.5vh, 0.625rem) auto;
				}

				h2 {
					font-size: clamp(0.75rem, 2.2vw, 0.8125rem);
					margin: clamp(0.5rem, 1vh, 0.625rem) auto;
				}

				.scene-card {
					font-size: clamp(0.75rem, 2vw, 0.875rem);
					padding: clamp(0.35rem, 0.9vh, 0.45rem) clamp(0.6rem, 1.5vw, 0.75rem);
					min-height: clamp(1.8rem, 3vh, 2.2rem);
				}

				button {
					font-size: clamp(0.6rem, 1.6vw, 0.625rem);
					padding: clamp(0.2rem, 0.5vh, 0.3125rem) clamp(0.4rem, 1vw, 0.625rem);
				}

				.actions {
					padding: clamp(0.3rem, 0.8vh, 0.375rem);
					gap: clamp(0.2rem, 0.6vw, 0.375rem);
				}
			}
			
			/* 超小横屏适配（宽度<600px 且横向） */
			@media (max-width: 600px) and (orientation: landscape) {
				.container {
					width: 98%;
					margin-top: clamp(2.2rem, 4.5vh, 2.8125rem);
				}
				
				.scene-grid {
					grid-template-columns: repeat(auto-fill, minmax(clamp(6rem, 18vw, 8rem), 1fr));
					gap: clamp(0.3rem, 0.8vw, 0.5rem);
				}
				
				h1 {
					font-size: clamp(0.9rem, 3vw, 1.1rem);
				}
				
				h2 {
					font-size: clamp(0.7rem, 2vw, 0.8rem);
				}
				
				.scene-card {
					font-size: clamp(0.7rem, 1.8vw, 0.8rem);
					padding: clamp(0.25rem, 0.6vh, 0.35rem) clamp(0.5rem, 1.2vw, 0.6rem);
					min-height: clamp(1.6rem, 2.5vh, 2rem);
				}
				
				.scene-name {
					font-size: inherit;
					line-height: 1.2;
				}
				
				button {
					font-size: clamp(0.55rem, 1.5vw, 0.65rem);
					padding: clamp(0.15rem, 0.4vh, 0.25rem) clamp(0.3rem, 0.8vw, 0.5rem);
				}
				
				.actions {
					padding: clamp(0.25rem, 0.6vh, 0.375rem);
					gap: clamp(0.15rem, 0.4vw, 0.25rem);
					flex-wrap: wrap;
				}
			}
			
			/* 智能返回提示框 */
			#smart-return-box {
				position: fixed;
				top: 80px;
				right: 30px;
				background: rgba(0, 0, 0, 0.85);
				border: 2px solid #2196F3;
				border-radius: 12px;
				padding: 20px;
				z-index: 1500;
				display: none;
				min-width: 280px;
				backdrop-filter: blur(10px);
				box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
				animation: slideInRight 0.3s ease;
			}

			@keyframes slideInRight {
				from {
					opacity: 0;
					transform: translateX(50px);
				}
				to {
					opacity: 1;
					transform: translateX(0);
				}
			}

			#return-message {
				color: #2196F3;
				font-size: 16px;
				font-weight: bold;
				margin-bottom: 15px;
				text-align: center;
			}

			#return-button {
				width: 100%;
				background: linear-gradient(135deg, rgba(33, 150, 243, 0.4), rgba(25, 118, 210, 0.4));
				border: 2px solid #2196F3;
				color: #fff;
				padding: 12px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 14px;
				font-weight: bold;
				transition: all 0.3s ease;
			}

			#return-button:hover {
				background: linear-gradient(135deg, rgba(33, 150, 243, 0.6), rgba(25, 118, 210, 0.6));
				border-color: #1976D2;
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
			}
		</style>
	<script src="../illustration.js"></script>
</head>
	<body>
		<!-- 背景容器 - 用作菜单背景 -->
		<div id="background-container"></div>

		<!-- 角色立绘容器 -->
		<div id="character-container"></div>

		<!-- 文本框区域 -->
		<div id="text-box-container">
			<div id="name-box">
				<span>[姓名]</span>
			</div>
			<div id="text-box">[文本]</div>
		</div>

		<!-- 选项容器 -->
		<div id="options-container"></div>

		<!-- 全屏文本模式 -->
		<div id="novel-mode-container">
			<div id="novel-text-box">[全屏文本]</div>
		</div>

		<!-- 音频播放器 -->
		<audio id="bgm-player" loop></audio>
		<audio id="se-player"></audio>
		<audio id="voice-player"></audio>


		<div class="container">

			<div class="actions">
				<button onclick="loadProgress()">刷新进度</button>
				<button onclick="location.href='archive.html'" class="primary">多存档位管理</button>
				<button onclick="location.href='flowchart.html'" class="primary">剧本流程图</button>
				<button onclick="exportSave()" class="export">导出存档</button>
				<button onclick="resetProgress()" class="delete">重置进度</button>
				<button onclick="location.href='../index.html'" class="back">返回主菜单(esc)</button>
			</div>

			<h1 id="page-title">游戏进度管理</h1>

			<!-- 智能返回提示框 -->
			<div id="smart-return-box" style="display: none;">
				<div id="return-message"></div>
				<button id="return-button" onclick="handleSmartReturn()"></button>
			</div>

			<div class="jump-section">
				<h2>快速跳转</h2>
				<div id="quick-jump-grid" class="scene-grid">
					<!-- 动态加载可跳转的场景按钮 -->
				</div>
			</div>

			<div id="status-message" class="status" style="display: none;"></div>
		</div>

		<script>
			// 存档管理器
			const SaveManager = {
				// 加载进度数据
				loadProgress: function() {
					const progressData = localStorage.getItem('gameProgress');
					if (progressData) {
						try {
							return JSON.parse(progressData);
						} catch (e) {
							console.error('加载进度失败:', e);
							this.showMessage('加载进度失败', 'error');
							return null;
						}
					}
					return null;
				},

				// 获取所有场景列表
				getAllScenes: function() {
					// 这里列出所有可能的scene文件
					return [
						'scene1.html',
						'scene2.html',
						'scene3.html'
					];
				},

				// 显示进度信息
				displayProgress: function() {
					const progressData = this.loadProgress();

					// 显示快速跳转按钮
					this.displayQuickJumpButtons(progressData);
				},

				// 导出存档
				exportSave: function() {
					const progressData = this.loadProgress();
					if (!progressData) {
						this.showMessage('没有可导出的进度数据', 'error');
						return;
					}

					// 创建下载链接
					const dataStr = JSON.stringify(progressData, null, 2);
					const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

					const exportFileDefaultName = `galgame_save_${new Date().toISOString().slice(0, 19)}.json`;

					const linkElement = document.createElement('a');
					linkElement.setAttribute('href', dataUri);
					linkElement.setAttribute('download', exportFileDefaultName);
					linkElement.click();

					this.showMessage('存档已导出', 'success');
				},

				// 重置进度
				resetProgress: function() {
					if (confirm('确定要重置所有游戏进度吗？此操作不可撤销。')) {
						localStorage.removeItem('gameProgress');
						this.displayProgress();
						this.showMessage('进度已重置', 'success');
					}
				},

				// 显示状态消息
				showMessage: function(message, type) {
					const statusDiv = document.getElementById('status-message');
					statusDiv.textContent = message;
					statusDiv.className = `status ${type}`;
					statusDiv.style.display = 'block';

					// 3秒后自动隐藏
					setTimeout(() => {
						statusDiv.style.display = 'none';
					}, 3000);
				},

			// 显示快速跳转按钮
			displayQuickJumpButtons: function(progressData) {
				const jumpGrid = document.getElementById('quick-jump-grid');
				jumpGrid.innerHTML = '';

				if (progressData && progressData.sceneMarkers) {
					const markers = progressData.sceneMarkers;
					const markerKeys = Object.keys(markers);

					// 过滤出已访问的场景(兼容新旧格式)
					const visitedScenes = markerKeys.filter(marker => {
						const value = markers[marker];
						// 新格式: {visited: 1, lastAccessTime: ...}
						// 旧格式: 1
						return (typeof value === 'object' && value.visited === 1) || value === 1;
					});

					if (visitedScenes.length > 0) {
						visitedScenes.forEach(sceneId => {
							const sceneFileName = `${sceneId}.html`;

							// 检查是否为有效的场景文件
							if (this.isValidSceneFile(sceneFileName)) {
								// 创建卡片元素，先用文件名作为默认名称
								const cardDiv = document.createElement('div');
								cardDiv.className = 'scene-card';
								cardDiv.setAttribute('data-scene', sceneFileName);
								cardDiv.setAttribute('data-scene-id', sceneId);
								cardDiv.onclick = function() {
									SaveManager.jumpToScene(sceneFileName);
								};
								cardDiv.innerHTML = `
                                    <div class="scene-name">加载中...</div>
                                `;
								jumpGrid.appendChild(cardDiv);

								// 异步获取场景标题
								this.fetchSceneTitle(sceneId, cardDiv);
							}
						});
					} else {
						jumpGrid.innerHTML = '<p style="text-align: center; color: #666;">还没有可以跳转的场景</p>';
					}
				} else {
					jumpGrid.innerHTML = '<p style="text-align: center; color: #666;">还没有可以跳转的场景</p>';
				}
			},

			// 异步获取场景文件的<title>标签
			fetchSceneTitle: function(sceneId, cardDiv) {
				const sceneFileName = `${sceneId}.html`;
				fetch(`../scenes/${encodeURIComponent(sceneFileName)}`)
					.then(response => {
						if (!response.ok) throw new Error('Network response was not ok');
						return response.text();
					})
					.then(html => {
						// 解析HTML获取<title>标签
						const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
						const title = titleMatch ? titleMatch[1].trim() : sceneId;
						// 更新卡片显示
						const nameDiv = cardDiv.querySelector('.scene-name');
						if (nameDiv) {
							nameDiv.textContent = title;
						}
					})
					.catch(error => {
						console.warn(`[SaveManager] Failed to fetch title for ${sceneFileName}:`, error);
						// 使用默认名称
						const nameDiv = cardDiv.querySelector('.scene-name');
						if (nameDiv) {
							nameDiv.textContent = sceneId.replace(/_/g, ' ').replace('scene', '场景 ');
						}
					});
			},


			// 检查是否为有效的场景文件
			isValidSceneFile: function(fileName) {
				// 排除非场景页面
				const excludedPatterns = [
					'_', 'demo', 'video', 'bgm', 'index', 'test', 'flowchart', 'saves', 'archive'
				];
				
				// 必须是以.html结尾的文件
				if (!fileName.endsWith('.html')) {
					return false;
				}
				
				// 检查是否包含排除模式
				const lowerFileName = fileName.toLowerCase();
				for (const pattern of excludedPatterns) {
					if (lowerFileName.includes(pattern)) {
						return false;
					}
				}
				
				return true;
			},

				// 跳转到指定场景
				jumpToScene: function(sceneFileName) {
					// 确定场景文件路径
					let fullPath = '';

					// 处理不同类型的页面跳转
					if (sceneFileName === 'index.html') {
						// 返回主菜单
						fullPath = '../index.html';
					} else if (['saves.html', 'bgm.html', 'video.html'].includes(sceneFileName)) {
						// 跳转到html目录下的页面
						fullPath = './' + sceneFileName;
					} else if (!sceneFileName.includes('/')) {
						// 跳转到scenes子目录下的场景文件
						fullPath = '../scenes/' + sceneFileName;
					} else {
						// 如果路径已包含目录信息，直接使用
						fullPath = '../' + sceneFileName;
					}

					// 跳转到指定场景
					window.location.href = fullPath;
				}
			};

			/**
			 * 智能返回功能管理器
			 */
			const SmartReturnManager = {
				/**
				 * 初始化智能返回功能
				 */
				init: function() {
					this.checkAndDisplayReturnBox();
				},

				/**
				 * 检查并显示返回提示框
				 */
				checkAndDisplayReturnBox: function() {
					console.log('[Smart Return] checkAndDisplayReturnBox called');

					const snapshot = this.loadStateSnapshot();
					console.log('[Smart Return] Snapshot:', snapshot);

					const box = document.getElementById('smart-return-box');
					const messageEl = document.getElementById('return-message');
					const buttonEl = document.getElementById('return-button');

					if (!box || !messageEl || !buttonEl) {
						console.error('[Smart Return] DOM elements not found!');
						return;
					}

					// 只处理从剧情页进入的情况
					if (snapshot && !snapshot.pagePath.includes('index.html') && snapshot.pagePath.includes(
						'/scenes/')) {
						// 从剧情页进入
						console.log('[Smart Return] From story page');
						messageEl.textContent = '当前游玩页面';
						buttonEl.textContent = '返回当前页面';

						// 保存场景信息用于返回
						sessionStorage.setItem('returnTarget', JSON.stringify({
							type: 'current',
							url: snapshot.pageUrl,
							line: snapshot.currentLine
						}));

						// 显示提示框
						box.style.display = 'block';
						console.log('[Smart Return] Showed return box');

						// 高亮当前游玩的场景卡片
						this.highlightCurrentScene(snapshot);
					} else {
						// 从主菜单进入或没有snapshot,隐藏提示框
						console.log('[Smart Return] From main menu or no snapshot, hiding box');
						box.style.display = 'none';
					}
				},

				/**
				 * 从sessionStorage加载状态快照
				 */
				loadStateSnapshot: function() {
					try {
						const snapshotStr = sessionStorage.getItem('gameStateSnapshot');
						if (snapshotStr) {
							return JSON.parse(snapshotStr);
						}
					} catch (e) {
						console.error('[Smart Return] Failed to load snapshot:', e);
					}
					return null;
				},



				/**
				 * 高亮当前游玩的场景卡片
				 * @param {Object} snapshot - 状态快照对象
				 */
				highlightCurrentScene: function(snapshot) {
					// 移除所有高亮类,避免冲突
					this.clearAllHighlights();

					// 从pagePath中提取场景文件名
					const pathParts = snapshot.pagePath.split('/');
					const sceneFileName = pathParts[pathParts.length - 1];

					// 查找对应的场景卡片（通过data-scene属性匹配）
					const cards = document.querySelectorAll('.scene-card');
					cards.forEach(card => {
						const cardScene = card.getAttribute('data-scene');
						if (cardScene === sceneFileName) {
							card.classList.add('current-playing-highlight');
							console.log('[Smart Return] Highlighted current playing scene:', sceneFileName,
								'at line', snapshot.currentLine);
						}
					});
				},

				/**
				 * 清除所有高亮类
				 */
				clearAllHighlights: function() {
					const cards = document.querySelectorAll('.scene-card');
					cards.forEach(card => {
						card.classList.remove('current-playing-highlight');
					});
				}
			};

			/**
			 * 处理智能返回按钮点击
			 */
			function handleSmartReturn() {
				const returnTargetStr = sessionStorage.getItem('returnTarget');
				if (!returnTargetStr) {
					console.warn('[Smart Return] No return target found');
					return;
				}

				try {
					const returnTarget = JSON.parse(returnTargetStr);
					console.log('[Smart Return] Return target:', returnTarget);

					if (returnTarget.type === 'current') {
						// 返回当前剧情页(带状态恢复)
						// 在URL中添加行号参数
						const url = new URL(returnTarget.url, window.location.origin);
						url.searchParams.set('startLine', returnTarget.line);
						console.log('[Smart Return] Returning to current scene:', url.toString());
						window.location.href = url.toString();
					}
				} catch (e) {
					console.error('[Smart Return] Failed to process return:', e);
				}
			}

			// 页面加载完成后初始化
			document.addEventListener('DOMContentLoaded', function() {
				console.log('[Saves Page] DOMContentLoaded triggered');

				// 先渲染场景列表
				SaveManager.displayProgress();
				console.log('[Saves Page] Scene list rendered');

				// 延迟一点再初始化智能返回,确保DOM完全就绪
				setTimeout(() => {
					SmartReturnManager.init();
					console.log('[Saves Page] SmartReturnManager initialized');
				}, 100);
			});

			// 全局函数
			function loadProgress() {
				SaveManager.displayProgress();
			}

			function exportSave() {
				SaveManager.exportSave();
			}

			function resetProgress() {
				SaveManager.resetProgress();
			}

			// ESC键返回主菜单
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') {
					window.location.href = '../index.html';
				}
			});
		</script>
	</body>
</html>
