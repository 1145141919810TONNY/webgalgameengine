<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>游戏进度管理</title>
		<link rel="icon" type="image/png" href="../icon/icon-32.png">
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 0;
				height: 100vh;
				overflow: hidden;
				position: relative;
				background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../assets/cg/bg.jpg') center center/cover no-repeat;
				display: flex;
				justify-content: center;
			}

			.container {
				width: 75%;
				margin-top: calc(70 * var(--v, 1px));
				/* 为固定顶部菜单留出空间 */
				margin-left: auto;
				margin-right: auto;
				background: transparent;
				padding: calc(15 * var(--u, 1px));
				border-radius: calc(8 * var(--u, 1px));
				box-shadow: none;
			}

			h1 {
				color: #FFD700;
				text-align: center;
				margin: calc(40 * var(--v, 1px)) auto calc(20 * var(--v, 1px)) auto;
				font-size: calc(32 * var(--u, 1px));
				text-shadow: 0 0 calc(10 * var(--u, 1px)) rgba(255, 215, 0, 0.5);
				width: fit-content;
			}

			.jump-section {
				margin: calc(15 * var(--v, 1px)) 0;
			}

			h2 {
				margin: calc(20 * var(--v, 1px)) auto calc(15 * var(--v, 1px)) auto;
				color: #FFD700;
				font-size: calc(18 * var(--u, 1px));
				text-shadow: 0 0 calc(5 * var(--u, 1px)) rgba(255, 215, 0, 0.8);
				width: fit-content;
				text-align: center;
			}

			.scene-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: calc(10 * var(--u, 1px));
				margin-bottom: calc(20 * var(--v, 1px));
				justify-content: center;
			}

			.scene-card {
				background-color: transparent;
				color: #FFD700;
				border: calc(2 * var(--u, 1px)) solid #FFD700;
				border-radius: calc(20 * var(--u, 1px));
				padding: calc(8 * var(--v, 1px)) calc(15 * var(--u, 1px));
				text-align: center;
				min-height: calc(40 * var(--v, 1px));
				display: flex;
				flex-direction: column;
				justify-content: center;
				cursor: pointer;
				transition: all 0.3s ease;
				font-size: calc(16 * var(--u, 1px));
				font-weight: bold;
			}

			.scene-card:hover {
				background-color: rgba(255, 215, 0, 0.2);
				color: #FFA500;
				border: calc(2 * var(--u, 1px)) solid #FFA500;
				transform: scale(1.03);
			}



			/* 当前游玩场景高亮样式 */
			.current-playing-highlight {
				border: calc(3 * var(--u, 1px)) solid #2196F3 !important;
				box-shadow: 0 0 calc(15 * var(--u, 1px)) rgba(33, 150, 243, 0.6), inset 0 0 calc(10 * var(--u, 1px)) rgba(33, 150, 243, 0.2) !important;
				background-color: rgba(33, 150, 243, 0.15) !important;
				position: relative;
				animation: pulse-blue 2s ease-in-out infinite;
			}

			.current-playing-highlight::before {
				content: '当前位置';
				position: absolute;
				top: calc(-12 * var(--v, 1px));
				right: calc(10 * var(--u, 1px));
				background: linear-gradient(135deg, #2196F3, #1976D2);
				color: #fff;
				padding: calc(2 * var(--v, 1px)) calc(10 * var(--u, 1px));
				border-radius: calc(10 * var(--u, 1px));
				font-size: calc(11 * var(--u, 1px));
				font-weight: bold;
				box-shadow: 0 calc(2 * var(--u, 1px)) calc(5 * var(--u, 1px)) rgba(0, 0, 0, 0.3);
				z-index: 10;
			}

			.current-playing-highlight:hover {
				background-color: rgba(33, 150, 243, 0.25) !important;
				border-color: #1976D2 !important;
			}


			/* 蓝色脉冲动画 */
			@keyframes pulse-blue {

				0%,
				100% {
					box-shadow: 0 0 calc(15 * var(--u, 1px)) rgba(33, 150, 243, 0.6), inset 0 0 calc(10 * var(--u, 1px)) rgba(33, 150, 243, 0.2);
				}

				50% {
					box-shadow: 0 0 calc(25 * var(--u, 1px)) rgba(33, 150, 243, 0.9), inset 0 0 calc(15 * var(--u, 1px)) rgba(33, 150, 243, 0.4);
				}
			}

			.actions {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				z-index: 1000;
				text-align: center;
				margin: 0;
				padding: calc(10 * var(--u, 1px));
				border: none;
				border-bottom: 1px solid #FFD700;
				background-color: transparent;
				box-shadow: 0 calc(2 * var(--u, 1px)) calc(5 * var(--u, 1px)) rgba(0, 0, 0, 0.1);
				display: flex;
				justify-content: center;
				align-items: center;
				gap: calc(10 * var(--u, 1px));
			}

			.container {
				width: 75%;
				margin-top: calc(70 * var(--v, 1px));
				/* 为固定顶部菜单留出空间 */
				margin-left: auto;
				margin-right: auto;
				background: transparent;
				padding: calc(15 * var(--u, 1px));
				border-radius: calc(8 * var(--u, 1px));
				box-shadow: none;
				overflow-y: auto;
				/* 添加垂直滚动支持 */
				max-height: calc(100vh - calc(90 * var(--v, 1px)));
				/* 限制最大高度，留出顶部和底部空间 */
			}

			button {
				background-color: transparent;
				color: #FFD700;
				padding: calc(8 * var(--v, 1px)) calc(16 * var(--u, 1px));
				border: calc(2 * var(--u, 1px)) solid #FFD700;
				border-radius: calc(20 * var(--u, 1px));
				cursor: pointer;
				margin: 0 calc(5 * var(--u, 1px));
				font-size: calc(14 * var(--u, 1px));
				font-weight: bold;
				transition: all 0.3s ease;
			}

			button:hover {
				background-color: rgba(255, 215, 0, 0.2);
				color: #FFA500;
				border: calc(2 * var(--u, 1px)) solid #FFA500;
			}

			button.delete {
				color: #f44336;
				border: calc(2 * var(--u, 1px)) solid #f44336;
			}

			button.delete:hover {
				background-color: rgba(244, 67, 54, 0.2);
				color: #da190b;
				border: calc(2 * var(--u, 1px)) solid #da190b;
			}

			button.primary {
				background-color: rgba(33, 150, 243, 0.3);
				border-color: #2196F3;
				color: #fff;
			}

			button.primary:hover {
				background-color: rgba(33, 150, 243, 0.5);
				border-color: #1976D2;
			}

			.status {
				margin-top: calc(10 * var(--v, 1px));
				padding: calc(8 * var(--u, 1px));
				border-radius: calc(4 * var(--u, 1px));
				text-align: center;
				font-size: calc(14 * var(--u, 1px));
			}

			.success {
				background-color: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
			}

			.error {
				background-color: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
			}

			/* 隐藏游戏相关元素（!important：官方 style.css 后注入，否则对话框底边黑条） */
			#background-container,
			#character-container,
			#text-box-container,
			#options-container,
			#novel-mode-container {
				display: none !important;
			}

			/* 音频播放器保持隐藏 */
			audio {
				display: none;
			}

			
			/* 智能返回提示框 */
			#smart-return-box {
				position: fixed;
				top: calc(80 * var(--v, 1px));
				right: calc(30 * var(--u, 1px));
				background: rgba(0, 0, 0, 0.85);
				border: calc(2 * var(--u, 1px)) solid #2196F3;
				border-radius: calc(12 * var(--u, 1px));
				padding: calc(20 * var(--u, 1px));
				z-index: 1500;
				display: none;
				min-width: calc(280 * var(--u, 1px));
				backdrop-filter: blur(calc(10 * var(--u, 1px)));
				box-shadow: 0 calc(4 * var(--u, 1px)) calc(20 * var(--u, 1px)) rgba(33, 150, 243, 0.3);
				animation: slideInRight 0.3s ease;
			}

			@keyframes slideInRight {
				from {
					opacity: 0;
					transform: translateX(calc(50 * var(--u, 1px)));
				}
				to {
					opacity: 1;
					transform: translateX(0);
				}
			}

			#return-message {
				color: #2196F3;
				font-size: calc(16 * var(--u, 1px));
				font-weight: bold;
				margin-bottom: calc(15 * var(--v, 1px));
				text-align: center;
			}

			#return-button {
				width: 100%;
				background: linear-gradient(135deg, rgba(33, 150, 243, 0.4), rgba(25, 118, 210, 0.4));
				border: calc(2 * var(--u, 1px)) solid #2196F3;
				color: #fff;
				padding: calc(12 * var(--u, 1px));
				border-radius: calc(8 * var(--u, 1px));
				cursor: pointer;
				font-size: calc(14 * var(--u, 1px));
				font-weight: bold;
				transition: all 0.3s ease;
			}

			#return-button:hover {
				background: linear-gradient(135deg, rgba(33, 150, 243, 0.6), rgba(25, 118, 210, 0.6));
				border-color: #1976D2;
				transform: translateY(calc(-2 * var(--u, 1px)));
				box-shadow: 0 calc(4 * var(--u, 1px)) calc(12 * var(--u, 1px)) rgba(33, 150, 243, 0.4);
			}

			/* ===== 指定内容回放 ===== */

			/* 回放卡片的标题与去向（卡片本体沿用 .scene-card 样式） */
			.replay-name {
				font-size: calc(16 * var(--u, 1px));
				font-weight: bold;
			}

			.replay-path {
				margin-top: calc(4 * var(--v, 1px));
				font-size: calc(11 * var(--u, 1px));
				font-weight: normal;
				opacity: 0.75;
			}

			#replay-hint {
				text-align: center;
				color: #bbb;
				font-size: calc(13 * var(--u, 1px));
				margin: calc(6 * var(--v, 1px)) 0;
			}

			#replay-report {
				margin-top: calc(10 * var(--v, 1px));
				padding: calc(10 * var(--u, 1px));
				border: 1px solid #FFD700;
				border-radius: calc(6 * var(--u, 1px));
				background: rgba(0, 0, 0, 0.55);
				color: #eee;
				font-family: Consolas, Menlo, monospace;
				font-size: calc(12 * var(--u, 1px));
				white-space: pre-wrap;
				word-break: break-all;
				max-height: calc(320 * var(--v, 1px));
				overflow: auto;
				display: none;
			}
		</style>
	<script src="../config/illustration.js"></script>
	<link rel="stylesheet" href="../ui/ui_skin.css">
	<script src="../ui/ui_skin.js"></script>
</head>
	<body>
		<!-- 背景容器 - 用作菜单背景 -->
		<div id="background-container"></div>

		<!-- 角色立绘容器 -->
		<div id="character-container"></div>

		<!-- 文本框区域 -->
		<div id="text-box-container">
			<div id="name-box">
				<span>[姓名]</span>
			</div>
			<div id="text-box">[文本]</div>
		</div>

		<!-- 选项容器 -->
		<div id="options-container"></div>

		<!-- 全屏文本模式 -->
		<div id="novel-mode-container">
			<div id="novel-text-box">[全屏文本]</div>
		</div>

		<!-- 音频播放器 -->
		<audio id="bgm-player" loop></audio>
		<audio id="se-player"></audio>
		<audio id="voice-player"></audio>


		<div class="container">

			<div class="actions">
				<button onclick="loadProgress()" data-ui="prog_act">刷新进度</button>
				<button onclick="location.href='archive.html'" class="primary" data-ui="prog_act">多存档位管理</button>
				<button onclick="location.href='flowchart.html'" class="primary" data-ui="prog_act">剧本流程图</button>
				<button onclick="exportSave()" class="export" data-ui="prog_act">导出存档</button>
				<button onclick="resetProgress()" class="delete" data-ui="prog_act">重置进度</button>
				<button onclick="location.href='../index.html'" class="back" data-ui="sub_back">返回主菜单(esc)</button>
			</div>

			<h1 id="page-title">游戏进度管理</h1>

			<!-- 智能返回提示框 -->
			<div id="smart-return-box" style="display: none;">
				<div id="return-message"></div>
				<button id="return-button" onclick="handleSmartReturn()" data-ui="sub_return"></button>
			</div>

			<div class="jump-section">
				<h2>快速跳转</h2>
				<div id="quick-jump-grid" class="scene-grid">
					<!-- 动态加载可跳转的场景按钮 -->
				</div>
			</div>

			<!-- 指定内容回放（内容由 ReplayManager 渲染；REPLAY_ENABLED=false 时整块保持隐藏） -->
			<div class="jump-section" id="replay-section" style="display: none;">
				<h2>指定内容回放</h2>
				<div id="replay-grid" class="scene-grid">
					<!-- 动态加载回放条目 -->
				</div>
				<div id="replay-hint"></div>
				<div id="replay-status" class="status" style="display: none;"></div>
				<div id="replay-tools" style="display: none; text-align: center; margin-top: calc(10 * var(--v, 1px));">
					<button onclick="ReplayManager.runCheck()" data-ui="prog_act">检查回放配置</button>
					<button onclick="ReplayManager.copyReport()" data-ui="prog_act">复制报告</button>
					<button onclick="ReplayManager.downloadReport()" data-ui="prog_act">导出 log</button>
				</div>
				<pre id="replay-report"></pre>
			</div>

			<div id="status-message" class="status" style="display: none;"></div>
		</div>

		<script>
			// 存档管理器
			const SaveManager = {
				// 加载进度数据
				loadProgress: function() {
					const progressData = localStorage.getItem('gameProgress');
					if (progressData) {
						try {
							return JSON.parse(progressData);
						} catch (e) {
							console.error('加载进度失败:', e);
							this.showMessage('加载进度失败', 'error');
							return null;
						}
					}
					return null;
				},

				// 显示进度信息
				displayProgress: function() {
					const progressData = this.loadProgress();

					// 显示快速跳转按钮
					this.displayQuickJumpButtons(progressData);
				},

				// 导出存档
				exportSave: function() {
					const progressData = this.loadProgress();
					if (!progressData) {
						this.showMessage('没有可导出的进度数据', 'error');
						return;
					}

					// 创建下载链接
					const dataStr = JSON.stringify(progressData, null, 2);
					const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

					const exportFileDefaultName = `galgame_save_${new Date().toISOString().slice(0, 19)}.json`;

					const linkElement = document.createElement('a');
					linkElement.setAttribute('href', dataUri);
					linkElement.setAttribute('download', exportFileDefaultName);
					linkElement.click();

					this.showMessage('存档已导出', 'success');
				},

				// 重置进度
				resetProgress: function() {
					if (confirm('确定要重置所有游戏进度吗？此操作不可撤销。')) {
						localStorage.removeItem('gameProgress');
						this.displayProgress();
						this.showMessage('进度已重置', 'success');
					}
				},

				// 显示状态消息
				showMessage: function(message, type) {
					const statusDiv = document.getElementById('status-message');
					statusDiv.textContent = message;
					statusDiv.className = `status ${type}`;
					statusDiv.style.display = 'block';

					// 3秒后自动隐藏
					setTimeout(() => {
						statusDiv.style.display = 'none';
					}, 3000);
				},

			// 显示快速跳转按钮
		displayQuickJumpButtons: function(progressData) {
			const self = this;
			const jumpGrid = document.getElementById('quick-jump-grid');
			jumpGrid.innerHTML = '';

			const showEmptyHint = function() {
				jumpGrid.innerHTML = '<p style="text-align: center; color: #666;">还没有可以跳转的场景</p>';
			};

			if (!progressData || !progressData.sceneMarkers) {
				showEmptyHint();
				return;
			}

			const markers = progressData.sceneMarkers;
			const markerKeys = Object.keys(markers);

			// 过滤出已访问的场景(兼容新旧格式)
			const visitedScenes = markerKeys.filter(marker => {
				const value = markers[marker];
				// 新格式: {visited: 1, lastAccessTime: ...}
				// 旧格式: 1
				return (typeof value === 'object' && value.visited === 1) || value === 1;
			});

			if (visitedScenes.length === 0) {
				showEmptyHint();
				return;
			}

			// 跟踪异步校验结果：仅在 scenes/ 目录内真实存在的文件才会保留卡片，
			// 历史/脏数据（如曾误存的 CG、archive 等系统页面）会因 fetch 404 被自动移除
			let pending = visitedScenes.length;
			let validCount = 0;

			const onCheckDone = function(exists) {
				if (exists) validCount++;
				pending--;
				if (pending === 0 && validCount === 0) {
					showEmptyHint();
				}
			};

			visitedScenes.forEach(sceneId => {
				const sceneFileName = `${sceneId}.html`;

				// 先创建卡片，标题与有效性通过异步 fetch 校验
				const cardDiv = document.createElement('div');
				cardDiv.className = 'scene-card';
				cardDiv.setAttribute('data-ui', 'prog_jump');
				cardDiv.setAttribute('data-scene', sceneFileName);
				cardDiv.setAttribute('data-scene-id', sceneId);
				cardDiv.onclick = function() {
					SaveManager.jumpToScene(sceneFileName);
				};
				cardDiv.innerHTML = `
					<div class="scene-name">加载中...</div>
				`;
				jumpGrid.appendChild(cardDiv);

				// 异步获取场景标题；若 scenes/ 内不存在该文件则移除卡片
				self.fetchSceneTitle(sceneId, cardDiv, onCheckDone);
			});
		},

		// 异步获取场景文件的<title>标签
		// 同时用于校验该文件是否真实存在于 scenes/ 目录内
		fetchSceneTitle: function(sceneId, cardDiv, onComplete) {
			const sceneFileName = `${sceneId}.html`;
			fetch(`../scenes/${encodeURIComponent(sceneFileName)}`)
				.then(response => {
					if (!response.ok) throw new Error('Scene not found: ' + response.status);
					return response.text();
				})
				.then(html => {
					// 解析HTML获取<title>标签
					const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
					const title = titleMatch ? titleMatch[1].trim() : sceneId;
					// 更新卡片显示
					const nameDiv = cardDiv.querySelector('.scene-name');
					if (nameDiv) {
						nameDiv.textContent = title;
					}
					if (onComplete) onComplete(true);
				})
				.catch(error => {
					console.warn(`[SaveManager] scenes/ 内未找到 ${sceneFileName}，移除该卡片:`, error);
					// 文件不存在（如历史脏数据），从 DOM 移除卡片
					if (cardDiv.parentNode) {
						cardDiv.parentNode.removeChild(cardDiv);
					}
					if (onComplete) onComplete(false);
				});
		},

		// 跳转到指定场景
		// 所有场景文件均位于 scenes/ 目录下（由 engine.js 保证仅记录 scenes/ 内的页面）
		jumpToScene: function(sceneFileName) {
			// ★ 场景入口跳入信号：目标场景加载后，engine.js 会读取
			// localStorage['shiori_scene_entry_' + sceneFileName] 中的 f.（该场景最近一次
			// 经 nextScene / choice 正常流程进入时的变量），实现“从头播放但变量接续”。
			// 同时清除可能残留的 nextScene 信号，避免被误判为跨场景续玩。
			try {
				sessionStorage.removeItem('shiori_next_scene_target');
				sessionStorage.setItem('shiori_scene_entry_jump', '1');
			} catch (e) {}
			window.location.href = '../scenes/' + sceneFileName;
		}
	};

			/**
			 * 智能返回功能管理器
			 */
			const SmartReturnManager = {
				/**
				 * 初始化智能返回功能
				 */
				init: function() {
					this.checkAndDisplayReturnBox();
				},

				/**
				 * 检查并显示返回提示框
				 */
				checkAndDisplayReturnBox: function() {
					console.log('[Smart Return] checkAndDisplayReturnBox called');

					const snapshot = this.loadStateSnapshot();
					console.log('[Smart Return] Snapshot:', snapshot);

					const box = document.getElementById('smart-return-box');
					const messageEl = document.getElementById('return-message');
					const buttonEl = document.getElementById('return-button');

					if (!box || !messageEl || !buttonEl) {
						console.error('[Smart Return] DOM elements not found!');
						return;
					}

					// 只处理从剧情页进入的情况
					if (snapshot && !snapshot.pagePath.includes('index.html') && snapshot.pagePath.includes(
						'/scenes/')) {
						// 从剧情页进入
						console.log('[Smart Return] From story page');
						messageEl.textContent = '当前游玩页面';

					const out = [];
					let m;
					while ((m = re.exec(text))) {
						if (/\bsrc\s*=/i.test(m[1])) continue;
						out.push(m[2]);
					}
					return out;
				},

				// 在桩环境里跑剧本脚本，只为拿到它交给 gameEngine.init 的数据
				runStub: function (scriptText) {
					let captured = null;
					const stubEngine = { init: function (d) { captured = d; } };
					const stubDoc = {
						addEventListener: function (type, fn) { try { if (typeof fn === 'function') fn(); } catch (e) { /* 桩内异常忽略 */ } },
						readyState: 'complete'
					};
					const stubWin = {
						location: { search: '', pathname: '/scenes/probe.html', href: '' },
						addEventListener: function () {},
						navigator: { userAgent: '' }
					};
					const silent = { log: function () {}, warn: function () {}, error: function () {} };
					const fn = new Function('gameEngine', 'document', 'window',
						'BG_CONFIG_SUB', 'BGM_CONFIG_SUB', 'console', scriptText);
					fn(stubEngine, stubDoc, stubWin, {}, {}, silent);
					return captured;
				},

				// 扫 story 数组：每个元素起点（偏移 + 行号）与全部回放标记
				scanStory: function (text) {
					const starts = this.lineStarts(text);
					const result = { elements: [], marks: [], arrayEnd: -1, found: false };

					// 1) 定位 story 键后的 [
					const keyM = /\bstory\s*:\s*\[/.exec(text);
					if (!keyM) return result;
					const open = keyM.index + keyM[0].length - 1;
					result.found = true;

					// 2) 括号扫描（跳过字符串与注释），记录 depth 从 1 进入元素时的 {
					let i = open + 1, depth = 1;
					while (i < text.length) {
						const c = text[i];
						if (c === '"' || c === "'" || c === '`') {
							const q = c; i++;
							while (i < text.length) {
								if (text[i] === '\\') { i += 2; continue; }
								if (text[i] === q) { i++; break; }
								i++;
							}
							continue;
						}
						if (c === '/' && text[i + 1] === '/') { while (i < text.length && text[i] !== '\n') i++; continue; }
						if (c === '/' && text[i + 1] === '*') {
							i += 2;
							while (i < text.length && !(text[i] === '*' && text[i + 1] === '/')) i++;
							i += 2; continue;
						}
						if (c === '[' || c === '{') {
							depth++;
							if (c === '{' && depth === 2) {
								result.elements.push({ offset: i, line: this.offsetToLine(starts, i), end: -1 });
							}
							i++; continue;
						}
						if (c === ']' || c === '}') {
							depth--;
							if (depth === 0) { result.arrayEnd = i; break; }
							if (c === '}' && depth === 1 && result.elements.length) {
								result.elements[result.elements.length - 1].end = i + 1;
							}
							i++; continue;
						}
						i++;
					}
					// 收尾：最后一个元素没闭合时用数组结尾兜底
					if (result.elements.length && result.elements[result.elements.length - 1].end === -1) {
						result.elements[result.elements.length - 1].end = (result.arrayEnd === -1) ? text.length : result.arrayEnd + 1;
					}

					// 3) 标记扫描：按偏移归入所属 story 元素
					const findElem = (off) => {
						for (let k = result.elements.length - 1; k >= 0; k--) {
							if (off >= result.elements[k].offset) return k;
						}
						return -1;
					};
					REPLAY_MARK_LOOSE.lastIndex = 0;
					let m;
					while ((m = REPLAY_MARK_LOOSE.exec(text))) {
						const off = m.index;
						const ei = findElem(off);
						if (ei === -1) continue;
						const elem = result.elements[ei];
						const body = text.slice(elem.offset, elem.end);
						const cmdM = /command\s*:\s*(["'])([\s\S]*?)\1/.exec(body);
						const cmd = cmdM ? cmdM[2] : null;
						const strict = !!(cmd && REPLAY_MARK_STRICT.test(cmd.trim()));
						const textM = /text\s*:\s*(["'])([\s\S]*?)\1/.exec(body);
						const hasContent = !!((textM && textM[2].trim()) ||
							/\b(action|background|bgm|se|chars|video|voice)\s*:/.test(body));
						result.marks.push({
							kind: m[1],                        // 'Begin' | 'End'
							index: ei,                         // story 下标
							line: this.offsetToLine(starts, off),
							strict: strict,
							cmd: cmd,
							hasContent: hasContent,
							body: body
						});
					}
					return result;
				},

				// 剧本文件的完整信息（含标记）
				loadScene: async function (file) {
					const fail = function (code, msg) { const e = new Error(msg); e.code = code; return e; };
					const url = '../scenes/' + encodeURIComponent(file + '.html');
					let resp;
					try { resp = await fetch(url, { cache: 'no-store' }); }
					catch (e) { throw fail('E-FILE-NOT-FOUND（文件不存在）', '读取请求失败：' + ((e && e.message) || e)); }
					if (!resp.ok) throw fail('E-FILE-NOT-FOUND（文件不存在）', 'HTTP ' + resp.status);
					const html = await resp.text();
					const norm = this.normalizeInjected(html);

					// 页面里可能有多段内联脚本（服务端会把整份 ui_size.js 插在最前面），
					// 所以逐段试跑、取第一段能交出 story 数组的 —— 不依赖「第几段是剧本」这种位置假设。
					const list = this.inlineScripts(norm.text);
					if (!list.length) throw fail('E-STORY-PARSE（story 解析失败）', '页面里没有内联脚本');
					let data = null;
					const tried = [];
					for (let i = 0; i < list.length; i++) {
						try {
							const d = this.runStub(list[i]);
							if (d && Array.isArray(d.story)) { data = d; break; }
							tried.push('第 ' + (i + 1) + ' 段没交出 story');
						} catch (e) {
							tried.push('第 ' + (i + 1) + ' 段执行失败（' + ((e && e.message) || e) + '）');
						}
					}
					if (!data) {
						throw fail('E-STORY-PARSE（story 解析失败）',
							'共 ' + list.length + ' 段内联脚本，没有一段交出 story —— ' + tried.join('；'));
					}
					const info = this.scanStory(norm.text);
					return {
						file: file, story: data.story, text: norm.text,
						lineAccurate: norm.lineAccurate, removed: norm.removed,
						elements: info.elements, marks: info.marks
					};
				},

				// ============ 渲染 ============

				setStatus: function (msg, type) {
					const el = document.getElementById('replay-status');
					if (!el) return;
					if (!msg) { el.style.display = 'none'; return; }
					el.textContent = msg;
					el.className = 'status ' + (type || 'success');
					el.style.display = 'block';
				},

				init: function () {
					const section = document.getElementById('replay-section');
					const hint = document.getElementById('replay-hint');
					const tools = document.getElementById('replay-tools');
					const grid = document.getElementById('replay-grid');
					if (!section || !grid) return;

					section.style.display = '';
					this.report = null;

					// 上回回放没退干净时清掉（正常流程由场景页负责清）
					try { sessionStorage.removeItem(REPLAY_KEYS.isReplay); } catch (e) { /* 忽略 */ }

					const norm = this.normalize();
					this.records = norm.list;
					this.normDiags = norm.diags;

					// 检查按钮：?debug=1 或「全部鉴赏」开启时可见
					let debug = false;
					try { debug = new URLSearchParams(location.search).get('debug') === '1'; } catch (e) { /* 忽略 */ }
					if (tools && (debug || this.isAllClearOn())) tools.style.display = '';

					const allClear = this.isAllClearOn();
					const unlocked = this.readUnlocked();

					// 条目显隐：已解锁才显示；「全部鉴赏」开启时全显（只影响显示，不解锁任何进度）
					const visible = this.records.filter(r => allClear || !!unlocked[r.end]);

					if (!visible.length) {
						grid.innerHTML = '';
						if (hint) {
							hint.textContent = this.records.length
								? '还没有可回放的内容：回放需要先在正片里玩到对应剧情的结尾才会解锁。'
								: '还没有配置回放条目。';
							hint.style.display = '';
						}
						return;
					}
					if (hint) hint.style.display = 'none';

					grid.innerHTML = '';
					visible.forEach(rec => {
						const card = document.createElement('div');
						card.className = 'scene-card';
						card.setAttribute('data-ui', 'prog_jump');
						card.setAttribute('data-replay-id', rec.id);
						const tip = allClear && !unlocked[rec.end] ? '（全部鉴赏预览）' : '';
						card.innerHTML = '<div class="replay-name"></div><div class="replay-path"></div>';
						card.querySelector('.replay-name').textContent = rec.title + tip;
						card.querySelector('.replay-path').textContent = this.chainText(rec);
						card.onclick = () => this.enter(rec);
						grid.appendChild(card);
					});
				},

				chainText: function (rec) {
					const parts = rec.chain.map(f => f + '.html');
					return parts.length === 1 ? parts[0] : parts.join(' → ');
				},

				// ============ 进入回放 ============

				enter: async function (rec) {
					if (!rec) return;
					this.setStatus('正在读取 ' + rec.begin + '.html …');

					let scene;
					try {
						scene = await this.loadScene(rec.begin);
					} catch (e) {
						this.setStatus('回放未启动：' + (e && e.message ? e.message : e), 'error');
						return;
					}

					const begins = scene.marks.filter(m => m.kind === 'Begin' && m.strict);
					if (!begins.length) {
						this.setStatus('回放未启动：' + rec.begin + '.html 里找不到 $tf.isReplayBegin 标记', 'error');
						return;
					}
					const b = begins[0];
					// 起点取行规则：纯标记行从「标记行 + 1」开始，带内容的标记行从该行本身开始
					const startAt = b.hasContent ? b.index : (b.index + 1);

					const payload = {
						v: 1,
						id: rec.id,
						title: rec.title,
						begin: rec.begin,
						again: rec.again.slice(),
						end: rec.end,
						chain: rec.chain.slice(),
						beginLine: b.index,
						startAt: startAt,
						endFile: rec.end,
						unlockKey: rec.end,
						enteredAt: Date.now()
					};

					try {
						sessionStorage.setItem(REPLAY_KEYS.isReplay, JSON.stringify(payload));
						// 让场景页继承 f. 镜像：回放要读与正片一致的变量基线
						sessionStorage.setItem('shiori_next_scene_target', rec.begin + '.html');
						// 清掉其它入口信号，避免读档 / 入口快照抢占起点
						sessionStorage.removeItem('archiveLoadTarget');
						sessionStorage.removeItem('gameStateSnapshot');
						sessionStorage.removeItem('shiori_scene_entry_jump');
					} catch (e) {
						this.setStatus('回放未启动：浏览器存储不可用', 'error');
						return;
					}

					window.location.href = '../scenes/' + encodeURIComponent(rec.begin + '.html') +
						'?startLine=' + startAt;
				},

				// ============ 检查器 ============

				resultLabel: function (level) {
					if (level === 'error') return '错误';
					if (level === 'warn') return '警告';
					if (level === 'info') return '需确认';
					return '通过';
				},

				runCheck: async function () {
					this.setStatus('正在检查回放配置 …');
					const report = document.getElementById('replay-report');
					const items = [];
					const push = (d) => { items.push(d); };

					// 1. 配置层（已在 init 时归一化过）
					const norm = this.normalize();
					norm.diags.forEach(push);

					// 2. 逐个文件扫描（缓存，避免同一文件重复 fetch）
					const cache = {};
					const loadCached = async (file) => {
						if (!(file in cache)) {
							try { cache[file] = await this.loadScene(file); }
							catch (e) {
								cache[file] = { error: (e && e.message) ? e.message : String(e),
									code: (e && e.code) ? e.code : '' };
							}
						}
						return cache[file];
					};

					for (let i = 0; i < norm.list.length; i++) {
						const rec = norm.list[i];
						const idx = rec.recIndex;
						const scope = 'REPLAY_RECORDS';
						const loc = 'html/saves.html';
						const recStart = items.length;   // 本条记录从哪一项开始，用于判定「整条无问题」

						// 2.1 文件存在性 + 行号可信度
						const scenes = {};
						for (const f of rec.chain) {
							const s = await loadCached(f);
							scenes[f] = s;
							if (s.error) {
								const notFound = (s.code === 'E-FILE-NOT-FOUND（文件不存在）') || !s.code;
								push(this.diag('error', scope, idx, null,
									notFound ? 'E-FILE-NOT-FOUND（文件不存在）' : s.code,
									'"' + rec.title + '" 引用的 scenes/' + f + '.html 读不到：' + s.error,
									notFound
										? '检查文件名是否正确、是否位于 scenes/ 目录内'
										: '文件在、但没能取出 story：多为服务端注入形状变了，请把这条报错原样反馈'));
							} else if (s.lineAccurate === false) {
								push(this.diag('warn', 'scenes/' + f + '.html', null, null,
									'W-LINE-SHIFT（行号可能偏移）',
									f + '.html 里仍有未剔除的服务端注入引用，行号可能对不上磁盘源文件',
									'请以报告里的 [story N] 下标为准定位'));
							}
						}

						// 2.2 标记存在性
						const beginScene = scenes[rec.begin];
						const endScene = scenes[rec.end];
						const strictBegin = beginScene && !beginScene.error
							? beginScene.marks.filter(m => m.kind === 'Begin' && m.strict) : [];
						const strictEnd = endScene && !endScene.error
							? endScene.marks.filter(m => m.kind === 'End' && m.strict) : [];

						if (beginScene && !beginScene.error) {
							if (!strictBegin.length) {
								push(this.diag('error', 'scenes/' + rec.begin + '.html', null, null,
									'E-BEGIN-MISSING（缺开始标记）',
									'"' + rec.title + '"：' + rec.begin + '.html 里找不到 $tf.isReplayBegin 标记',
									'在剧本里加一行 { text: "", command: "$tf.isReplayBegin = 1" }'));
							} else if (strictBegin.length > 1) {
								push(this.diag('error', 'scenes/' + rec.begin + '.html', null, strictBegin[1].line,
									'E-BEGIN-MISSING（缺开始标记）',
									rec.begin + '.html 里有 ' + strictBegin.length + ' 个 isReplayBegin 标记，无法确定起点',
									'一个文件里只保留一个开始标记'));
							}
							// 标记写法的松散命中
							beginScene.marks.forEach(m => {
								if (m.kind !== 'Begin') return;
								if (!m.strict) {
									const noDollar = !(m.cmd && m.cmd.trim().charAt(0) === '$');
									push(this.diag(noDollar ? 'error' : 'warn', 'scenes/' + rec.begin + '.html', m.index, m.line,
										'E-MARK-NOT-STRICT（标记不是严格形）',
										noDollar
											? '这一行的标记没写在 $ 引导的变量语句区里，引擎不会执行、也不会识别'
											: '这一行的标记写法不是严格形，运行时不会识别（该行退化为普通 $ 语句）',
										noDollar
											? '写成 command: "$tf.isReplayBegin = 1"'
											: '整行只写 $tf.isReplayBegin = 1，不要混入 ? 条件或其它语句'));
								}
								if (m.hasContent) {
									push(this.diag('info', 'scenes/' + rec.begin + '.html', m.index, m.line,
										'I-MARK-HAS-TEXT（标记行带内容）',
										'该标记行还带有台词或演出字段，回放会从这一行本身开始播',
										'若想让回放从标记的下一行开始，把该行写成纯标记行（只留 command）'));
								}
							});
							if (strictBegin.length && strictBegin[0].hasContent) {
								push(this.diag('info', 'scenes/' + rec.begin + '.html', strictBegin[0].index, strictBegin[0].line,
									'I-MARK-HAS-TEXT（标记行带内容）',
									'开始标记行带内容，回放起点 = 该行本身',
									'这是预期行为，不必修改'));
							}
						}

						if (endScene && !endScene.error) {
							if (!strictEnd.length) {
								push(this.diag('error', 'scenes/' + rec.end + '.html', null, null,
									'E-END-MISSING（缺结束标记）',
									'"' + rec.title + '"：' + rec.end + '.html 里找不到 $tf.isReplayEnd 标记',
									'该条目永远无法被正片解锁；补一行 { text: "", command: "$tf.isReplayEnd = 1" }'));
							} else if (strictEnd.length > 1) {
								push(this.diag('error', 'scenes/' + rec.end + '.html', null, strictEnd[1].line,
									'E-END-MISSING（缺结束标记）',
									rec.end + '.html 里有 ' + strictEnd.length + ' 个 isReplayEnd 标记',
									'一个文件里只保留一个结束标记'));
							}
							endScene.marks.forEach(m => {
								if (m.kind !== 'End' || m.strict) return;
								const noDollar = !(m.cmd && m.cmd.trim().charAt(0) === '$');
								push(this.diag(noDollar ? 'error' : 'warn', 'scenes/' + rec.end + '.html', m.index, m.line,
									'E-MARK-NOT-STRICT（标记不是严格形）',
									noDollar
										? '这一行的标记没写在 $ 引导的变量语句区里，引擎不会执行、也不会识别'
										: '这一行的结束标记不是严格形，回放跑到这里不会被识别',
									noDollar
										? '写成 command: "$tf.isReplayEnd = 1"'
										: '整行只写 $tf.isReplayEnd = 1'));
							});
						}

						// 2.3 中间文件不得有任何标记
						for (const f of rec.again) {
							const s = scenes[f];
							if (!s || s.error) continue;
							s.marks.forEach(m => {
								if (!m.strict) return;
								push(this.diag('error', 'scenes/' + f + '.html', m.index, m.line,
									'E-MARK-IN-AGAIN（中间文件不该有标记）',
									'中间文件 ' + f + '.html 里出现了 isReplay' + m.kind + ' 标记',
									'中间文件只负责把剧情接到下一个文件，标记只属于首尾文件'));
							});
						}

						// 2.4 同一文件里 end 在 begin 之前
						if (rec.begin === rec.end && strictBegin.length && strictEnd.length &&
							strictEnd[0].index < strictBegin[0].index) {
							push(this.diag('warn', 'scenes/' + rec.begin + '.html', strictEnd[0].index, strictEnd[0].line,
								'W-END-BEFORE-BEGIN（end 在 begin 之前）',
								rec.begin + '.html 里 isReplayEnd 出现在 isReplayBegin 之前，回放区间为空',
								'把结束标记挪到开始标记之后'));
						}

						// 2.5 跳转链连通性（静态推演出口）
						const chainOk = await this.checkChain(rec, scenes, idx, push);

						// 「通过」只在整条记录一项诊断都没有时给 —— 否则「通过」与上面的
						// 错误 / 警告并列出现，看起来自相矛盾。
						// 配置层（归一化阶段）的诊断按 recIndex 归到本条记录，一并计入。
						const recItems = items.slice(recStart);
						const cfgBad = norm.diags.filter(d =>
							d.scope === 'REPLAY_RECORDS' && d.index === idx && d.level !== 'ok');
						if (chainOk && recItems.length === 0 && cfgBad.length === 0) {
							push(this.diag('ok', 'REPLAY_RECORDS', idx, null,
								'I-OK（检查通过）',
								'"' + rec.title + '"（情况 ' + rec.scene + '）：' +
								this.chainText(rec) + '，标记齐全、出口唯一',
								''));
						}
					}

					// 3. 汇总
					const counts = { error: 0, warn: 0, info: 0, ok: 0 };
					items.forEach(d => { if (d.level in counts) counts[d.level]++; });
					const lines = [];
					lines.push('Shiori 回放检查报告');
					lines.push('时间: ' + new Date().toLocaleString());
					lines.push('页面: html/saves.html');
					lines.push('记录: ' + norm.list.length + ' 条（错误 ' + counts.error +
						' / 警告 ' + counts.warn + ' / 需确认 ' + counts.info + ' / 通过 ' + counts.ok + '）');
					lines.push('行号: 已剔除服务端注入行，对应 scenes/ 下磁盘源文件的物理行号');
					lines.push('-'.repeat(60));
					if (!items.length) {
						lines.push('[通过] 未发现任何问题');
					} else {
						items.forEach(d => {
							const isRec = (d.scope === 'REPLAY_RECORDS');
							const where = isRec
								? 'REPLAY_RECORDS[' + (d.index === null ? '-' : d.index) + ']'
								: d.scope + (d.index === null ? '' : ' [story ' + d.index + ']');
							if (d.level === 'ok') {
								lines.push('[' + this.resultLabel(d.level) + '] ' + where + '  ' + d.message);
								return;
							}
							const loc = isRec ? 'html/saves.html'
								: (d.line != null ? (d.scope + ':' + d.line) : '（行号不可用）');
							lines.push('[' + this.resultLabel(d.level) + '] ' + where + '  ' + loc);
							lines.push('       ' + d.code + '  ' + d.message);
							if (d.hint) lines.push('       提示: ' + d.hint);
							lines.push('');
						});
					}
					lines.push('-'.repeat(60));
					lines.push('说明: 运行期遇到这些问题一律静默跳过，不影响剧情推进；');
					lines.push('      「全部鉴赏」开启时不会解锁任何进度，也不会写入存档。');

					this.report = lines.join('\n');
					if (report) {
						report.textContent = this.report;
						report.style.display = 'block';
					}
					this.setStatus('检查完成：错误 ' + counts.error + ' / 警告 ' + counts.warn + ' / 需确认 ' + counts.info);
				},

				// 静态推演每个非末文件的出口是否唯一且指向链中的下一个文件
				checkChain: async function (rec, scenes, idx, push) {
					let ok = true;
					for (let k = 0; k < rec.chain.length - 1; k++) {
						const f = rec.chain[k];
						const next = rec.chain[k + 1];
						const s = scenes[f];
						if (!s || s.error) { ok = false; continue; }

						// 该文件里所有指向别处的 target（scenes/ 内文件形式）
						const body = s.text;
						const targets = [];
						const reTarget = /target\s*:\s*(["'])([^"']+\.html[^"']*)\1/g;
						let m;
						while ((m = reTarget.exec(body))) targets.push(m[2]);
						const reNextScene = /nextScene\s*:\s*(["'])([^"']+)\1/g;
						while ((m = reNextScene.exec(body))) targets.push(m[2]);

						const uniq = Array.from(new Set(targets));
						// 去掉锚点与查询串后只比文件名
						const normTargets = uniq.map(t => (t.split('#')[0].split('?')[0].split('/').pop() || t));

						if (!normTargets.length) {
							push(this.diag('error', 'scenes/' + f + '.html', null, null,
								'E-CHAIN-BREAK（跳转链断开）',
								f + '.html 里找不到任何跳转，链走不到 ' + next + '.html',
								'回放区间内每个非末文件的出口必须是一条无条件直跳'));
							ok = false;
							continue;
						}

						// 出口是否唯一指向下一文件
						const expected = next + '.html';
						const hits = normTargets.filter(t => t === expected);
						if (!hits.length) {
							push(this.diag('error', 'scenes/' + f + '.html', null, null,
								'E-CHAIN-BREAK（跳转链断开）',
								f + '.html 的跳转目标是 ' + normTargets.join(' / ') + '，与链中的下一个文件 ' + expected + ' 不一致',
								'把记录里的 again / end 顺序改成与实际跳转一致，或修正剧本里的跳转目标'));
							ok = false;
						} else if (normTargets.length > 1) {
							push(this.diag('warn', 'scenes/' + f + '.html', null, null,
								'E-EXIT-COND（出口是条件跳转）',
								f + '.html 里有多个跳转目标（' + normTargets.join(' / ') + '），出口不是唯一的无条件直跳',
								'回放区间内的分支会让回放去向不确定；确认这些分支不影响回放路线'));
							ok = false;
						}

						// 区间内是否存在依赖变量的条件
						if (/\bwhen\s*:/.test(body) || /\$\s*\?/.test(body)) {
							push(this.diag('info', 'scenes/' + f + '.html', null, null,
								'W-COND-DEP（区间依赖变量,路线可能不同）',
								f + '.html 的回放区间里存在条件判定，路线可能随变量变化',
								'回放期 f. / sf. 的写入已被冻结，读值取的是进入回放时的基线'));
						}
					}
					return ok;
				},

				copyReport: function () {
					if (!this.report) { this.setStatus('请先点「检查回放配置」', 'error'); return; }
					const done = () => this.setStatus('报告已复制到剪贴板');
					try {
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard.writeText(this.report).then(done).catch(() => this.fallbackCopy(done));
						} else {
							this.fallbackCopy(done);
						}
					} catch (e) { this.setStatus('复制失败', 'error'); }
				},

				fallbackCopy: function (done) {
					try {
						const ta = document.createElement('textarea');
						ta.value = this.report;
						document.body.appendChild(ta);
						ta.select();
						document.execCommand('copy');
						document.body.removeChild(ta);
						done();
					} catch (e) { this.setStatus('复制失败', 'error'); }
				},

				downloadReport: function () {
					if (!this.report) { this.setStatus('请先点「检查回放配置」', 'error'); return; }
					try {
						const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
						const blob = new Blob([this.report], { type: 'text/plain;charset=utf-8' });
						const a = document.createElement('a');
						a.href = URL.createObjectURL(blob);
						a.download = 'shiori_replay_check_' + stamp + '.log';
						a.click();
						setTimeout(() => URL.revokeObjectURL(a.href), 3000);
						this.setStatus('报告已导出为 log 文件');
					} catch (e) { this.setStatus('导出失败：' + (e && e.message ? e.message : e), 'error'); }
				}
			};

			// 宿主「清除所有存档」只注入 JS 删键 + alert(...) + reload，不发 postMessage；
			// 若玩家恰好停在存档页，vars.js 不在场 —— 这里自挂同款钩子补上这条路。
			(function () {
				if (!REPLAY_ENABLED) return;
				if (typeof window.alert !== 'function') return;
				const orig = window.alert;
				window.alert = function (msg) {
					try {
						const s = (msg == null) ? '' : String(msg);
						const lower = s.toLowerCase();
						const hasClear = lower.indexOf('清除') !== -1 || lower.indexOf('清空') !== -1 || lower.indexOf('clear') !== -1;
						const hasData = lower.indexOf('游戏数据') !== -1 || lower.indexOf('存档') !== -1 || lower.indexOf('saves') !== -1;
						if (hasClear && hasData) {
							localStorage.removeItem(REPLAY_KEYS.unlocked);
							sessionStorage.removeItem(REPLAY_KEYS.isReplay);
							console.log('[Replay] 检出宿主清档，已清除回放解锁记录');
						}
					} catch (e) { /* 忽略检测错误，不影响原生 alert */ }
					return orig.apply(this, arguments);
				};
			})();

			// 初始化（REPLAY_ENABLED=false 时整块旁路）
			(function () {
				if (!REPLAY_ENABLED) return;
				const boot = function () {
					try { ReplayManager.init(); }
					catch (e) { console.warn('[Replay] 初始化失败', e); }
				};
				if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
				else boot();
			})();
		</script>
	</body>
</html>
