<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>CG 鉴赏</title>
		<link rel="icon" type="image/png" href="../icon/icon-32.png">
		<link rel="stylesheet" href="../css/style.css">
		<style>
			body {
				margin: 0;
				padding: 0;
				height: 100vh;
				overflow: hidden;
				position: relative;
				background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../assets/cg/bg.jpg') center center/cover no-repeat;
				font-family: 'Microsoft YaHei', sans-serif;
				display: flex;
				justify-content: center;
			}

			/* CG列表容器 */
			#cg-container {
				position: absolute;
				right: 0;
				top: 80px;
				/* 留出标题空间 */
				width: 100%;
				height: calc(100% - 150px);
				/* 减去标题和返回按钮的空间 */
				background-color: transparent;
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				/* 自适应列数 */
				grid-auto-rows: auto;
				gap: 15px;
				justify-content: center;
				align-content: start;
				/* 内容从顶部开始排列 */
				z-index: 10;
				padding: 20px;
				box-sizing: border-box;
				overflow-y: auto;
				/* 添加垂直滚动 */
				overflow-x: hidden;
				/* 防止水平滚动 */
				/* 针对QtWebEngine的性能优化 */
				contain: layout style;
				/* 限制布局影响范围 */
				will-change: scroll-position;
				/* 提示浏览器该元素将要滚动 */
			}

			/* CG标题 */
			#cg-title {
				color: white;
				font-size: 32px;
				margin-bottom: 40px;
				text-align: center;
				text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
			}

			/* CG图片缩略图样式 */
			.cg-thumbnail {
				width: 100%;
				height: 150px;
				object-fit: cover;
				border-radius: 10px;
				cursor: pointer;
				transition: all 0.3s ease;
				border: 2px solid transparent;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
				/* 针对QtWebEngine的性能优化 */
				will-change: transform;
				/* 提示浏览器该元素将要改变 */
				transform: translateZ(0);
				/* 启用GPU加速 */
				image-rendering: optimizeSpeed;
				/* 优先速度而非质量（适合缩略图） */
				-webkit-image-rendering: optimizeSpeed;
				-moz-image-rendering: optimizeSpeed;
				-ms-interpolation-mode: nearest-neighbor;
				/* IE */
			}

			.cg-thumbnail:hover {
				transform: scale(1.05);
				border: 2px solid #FFD700;
				box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
				/* 优化hover性能 */
				transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
			}

			/* 放大图片的模态框 */
			.modal {
				display: none;
				position: fixed;
				z-index: 2000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.9);
				justify-content: center;
				align-items: center;
			}

			.modal-content {
				max-width: 90%;
				max-height: 90%;
				border-radius: 10px;
				box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
				/* 针对QtWebEngine的性能优化 */
				image-rendering: -webkit-optimize-contrast;
				/* Chrome/Safari */
				image-rendering: optimizeQuality;
				/* Firefox */
				-ms-interpolation-mode: bicubic;
				/* IE */
				will-change: transform;
				/* 提示浏览器该元素将要改变 */
				transform: translateZ(0);
				/* 启用GPU加速 */
			}

			.close {
				position: absolute;
				top: 20px;
				right: 35px;
				color: #fff;
				font-size: 40px;
				font-weight: bold;
				cursor: pointer;
				z-index: 2001;
			}

			.close:hover {
				color: #FFD700;
			}

			/* 导航按钮 */
			.nav-button {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
				background-color: rgba(0, 0, 0, 0.5);
				color: white;
				font-size: 30px;
				font-weight: bold;
				cursor: pointer;
				z-index: 2001;
				padding: 20px;
				border-radius: 50%;
				transition: all 0.3s ease;
				user-select: none;
			}

			.prev-nav {
				left: 20px;
			}

			.next-nav {
				right: 20px;
			}

			.nav-button:hover {
				background-color: rgba(255, 215, 0, 0.8);
				color: white;
				transform: translateY(-50%) scale(1.1);
			}

			/* 图片计数器 */
			.image-counter {
				position: absolute;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				color: white;
				font-size: 18px;
				font-weight: bold;
				background-color: rgba(0, 0, 0, 0.5);
				padding: 5px 15px;
				border-radius: 20px;
				z-index: 2001;
			}

			/* 加载提示样式 */
			.loading-indicator {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: #FFD700;
				font-size: 24px;
				font-weight: bold;
				text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
				z-index: 3000;
				display: none;
				background-color: rgba(0, 0, 0, 0.8);
				padding: 20px 40px;
				border-radius: 10px;
				border: 2px solid #FFD700;
			}

			/* 返回按钮 */
			.back-btn {
				position: absolute;
				bottom: 20px;
				right: 20px;
				padding: 10px 20px;
				background-color: transparent;
				color: #FFD700;
				border: 2px solid #FFD700;
				border-radius: 20px;
				font-weight: bold;
				cursor: pointer;
				text-decoration: none;
				text-align: center;
				transition: all 0.3s ease;
				z-index: 100;
			}

			.back-btn:hover {
				background-color: rgba(255, 215, 0, 0.2);
				color: #FFA500;
				border: 2px solid #FFA500;
			}

			/* 页面标题 */
			#page-title {
				position: absolute;
				top: 20px;
				left: 0;
				width: 100%;
				text-align: center;
				color: #FFD700;
				font-size: 32px;
				margin: 0;
				text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
				z-index: 20;
			}

			/* 隐藏游戏相关元素 */
			#background-container,
			#character-container,
			#text-box-container,
			#options-container,
			#novel-mode-container {
				display: none;
			}

			/* 音频播放器保持隐藏 */
			audio {
				display: none;
			}

			/* ========================================
           响应式设计 - 小屏幕适配
           ======================================== */

			/* 小屏幕适配（1366x768） */
			@media (max-width: 1366px) and (max-height: 768px) {
				#page-title {
					font-size: 28px;
				}

				.cg-thumbnail {
					height: 120px;
				}

				.close {
					font-size: 35px;
				}

				.nav-button {
					font-size: 25px;
					padding: 15px;
				}

				.image-counter {
					font-size: 16px;
				}

				.back-btn {
					font-size: 13px;
					padding: 8px 16px;
				}
			}

			/* 更小屏幕适配（1280x720） */
			@media (max-width: 1280px) and (max-height: 720px) {
				#page-title {
					font-size: 24px;
				}

				.cg-thumbnail {
					height: 100px;
				}

				.close {
					font-size: 30px;
				}

				.nav-button {
					font-size: 20px;
					padding: 12px;
				}

				.image-counter {
					font-size: 14px;
				}

				.back-btn {
					font-size: 12px;
					padding: 6px 12px;
				}
			}

			/* 极小屏幕适配（< 800px） */
			@media (max-width: 800px) {
				#page-title {
					font-size: 20px;
				}

				#cg-container {
					grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
					gap: 10px;
				}

				.cg-thumbnail {
					height: 90px;
				}

				.close {
					font-size: 25px;
					top: 10px;
					right: 15px;
				}

				.nav-button {
					font-size: 18px;
					padding: 10px;
				}

				.prev-nav {
					left: 10px;
				}

				.next-nav {
					right: 10px;
				}

				.image-counter {
					font-size: 12px;
					bottom: 10px;
				}
			}

			/* 超小高度适配（高度 < 500px） */
			@media (max-height: 500px) {
				#page-title {
					font-size: 18px;
					top: 10px;
				}

				#cg-container {
					top: 45px;
					height: calc(100% - 75px);
				}

				.cg-thumbnail {
					height: 80px;
				}

				.close {
					font-size: 22px;
					top: 8px;
					right: 12px;
				}

				.nav-button {
					font-size: 16px;
					padding: 8px;
				}

				.image-counter {
					font-size: 11px;
					bottom: 8px;
				}

				.back-btn {
					font-size: 11px;
					padding: 5px 10px;
					bottom: 10px;
					right: 10px;
				}
			}
		</style>
	</head>
	<body>
		<!-- 背景容器 - 用作菜单背景 -->
		<div id="background-container"></div>

		<!-- 角色立绘容器 -->
		<div id="character-container"></div>

		<!-- 文本框区域 -->
		<div id="text-box-container">
			<div id="name-box">
				<span>[姓名]</span>
			</div>
			<div id="text-box">[文本]</div>
		</div>

		<!-- 选项容器 -->
		<div id="options-container"></div>

		<!-- 全屏文本模式 -->
		<div id="novel-mode-container">
			<div id="novel-text-box">[全屏文本]</div>
		</div>

		<!-- 音频播放器 -->
		<audio id="bgm-player" loop></audio>
		<audio id="se-player"></audio>
		<audio id="voice-player"></audio>

		<!-- 引擎脚本 -->
		<script src="../cg_config.js"></script>
		<script src="../bgm_config.js"></script>
		<script src="../system.js"></script>
		<script src="../engine.js"></script>

		<!-- 页面标题 -->
		<h1 id="page-title">CG鉴赏</h1>

		<!-- CG列表容器 -->
		<div id="cg-container">
			<!-- CG图片将通过JavaScript动态加载 -->
		</div>

		<!-- 放大图片的模态框 -->
		<div id="imageModal" class="modal">
			<span class="close">&times;</span>
			<img class="modal-content" id="modalImage">
			<div class="nav-button prev-nav">&#10094;</div>
			<div class="nav-button next-nav">&#10095;</div>
			<div class="image-counter">1 / 1</div>
		</div>

		<!-- 返回主菜单按钮 -->
		<a href="../index.html" class="back-btn">返回主菜单(esc)</a>

		<script>
			const indexData = {
				bgm: BGM_CONFIG_SUB,
				story: [{
					text: "",
					bgm: 'bgm1', // 播放BGM
					action: null
				}]
			};
		
			// CG图片管理器
			const CGManager = {
				// 当前显示的图片索引
				currentImageIndex: 0,
		
				// 缓存已加载的图片对象（用于快速切换）
				imageCache: {},
		
				// 最大缓存数量（防止内存溢出）
				maxCacheSize: 5,
		
				// 初始化CG列表
				init: function() {
					this.loadCGList();
					this.bindEvents();
					this.preloadAdjacentImages(); // 预加载相邻图片
				},
		
				// 加载CG列表（优化：针对QtWebEngine的懒加载和性能优化）
				loadCGList: function() {
					const container = document.getElementById('cg-container');
					container.innerHTML = '';
		
					const paths = Object.values(CG_CONFIG_SUB);
					const self = this;
		
					console.log(`[INFO] Rendering CG thumbnails (${paths.length} items) with lazy loading...`);
		
					// 使用DocumentFragment批量添加，减少DOM操作次数
					const fragment = document.createDocumentFragment();
		
					// 立即创建所有缩略图元素，但使用懒加载
					paths.forEach(function(path, index) {
						const img = document.createElement('img');
		
						// 设置src，但启用懒加载
						img.src = path;
						img.alt = `CG ${index + 1}`;
						img.className = 'cg-thumbnail';
						img.dataset.fullPath = path;
						img.dataset.index = index;
		
						// 添加loading="lazy"属性启用浏览器原生懒加载
						img.loading = 'lazy';
		
						// 添加解码异步化提示，减少主线程阻塞
						img.decoding = 'async';
		
						// 监听加载状态（用于调试）
						img.addEventListener('load', function() {
							console.log(`[INFO] Thumbnail loaded: ${path}`);
						});
		
						img.addEventListener('error', function() {
							console.warn(`[WARN] Failed to load thumbnail: ${path}`);
						});
		
						// 添加点击事件以放大显示
						img.addEventListener('click', function(e) {
							self.currentImageIndex = parseInt(e.target.dataset.index);
							self.showFullImage(e.target.dataset.fullPath);
						});
		
						// 添加到fragment而不是直接添加到container
						fragment.appendChild(img);
					});
		
					// 一次性将所有缩略图添加到容器中
					container.appendChild(fragment);
		
					// 延迟预加载相邻图片，避免与初始渲染冲突
					setTimeout(() => {
						self.preloadAdjacentImages();
					}, 1000);
		
					console.log(`[INFO] CG thumbnails rendered (${paths.length} items)`);
				},
		
				// 显示全尺寸图片（优化：针对QtWebEngine的内存管理和性能优化）
				showFullImage: function(imageSrc) {
					const modal = document.getElementById('imageModal');
					const modalImg = document.getElementById('modalImage');
					const loadingIndicator = document.getElementById('loadingIndicator');
		
					console.log(`[INFO] Showing full-size image: ${imageSrc}`);
		
					// 隐藏之前的图片，准备新图片加载
					modalImg.style.visibility = 'hidden';
		
					// 记录开始时间以测量加载速度
					const startTime = performance.now();
		
					// 显示加载提示（如果图片未缓存，可能需要短暂显示）
					let loadingShown = false;
					const loadingTimeout = setTimeout(() => {
						loadingIndicator.style.display = 'block';
						loadingShown = true;
					}, 100); // 100ms后才显示加载提示，避免闪烁
		
					// 检查是否在缓存中有该图片
					if (this.imageCache[imageSrc]) {
						// 直接使用缓存中的图片数据
						modalImg.src = this.imageCache[imageSrc].src;
		
						// 立即显示，因为已经在内存中
						modalImg.onload = () => {
							clearTimeout(loadingTimeout);
							if (loadingShown) {
								loadingIndicator.style.display = 'none';
							}
		
							// 图片加载完成后显示
							modalImg.style.visibility = 'visible';
		
							const endTime = performance.now();
							const loadTime = (endTime - startTime).toFixed(2);
							console.log(`[INFO] Full image displayed from cache in ${loadTime}ms`);
						};
					} else {
						// 如果没有缓存，则正常加载
						modalImg.onload = function() {
							clearTimeout(loadingTimeout);
							if (loadingShown) {
								loadingIndicator.style.display = 'none';
							}
		
							// 图片加载完成后显示
							modalImg.style.visibility = 'visible';
		
							const endTime = performance.now();
							const loadTime = (endTime - startTime).toFixed(2);
							console.log(
							`[INFO] Full image displayed in ${loadTime}ms (should be instant if cached)`);
						};
		
						modalImg.onerror = function() {
							clearTimeout(loadingTimeout);
							if (loadingShown) {
								loadingIndicator.style.display = 'none';
							}
							console.error(`[ERROR] Failed to load full image: ${imageSrc}`);
							alert('图片加载失败，请检查文件是否存在');
						};
		
						// 重新设置src以触发加载（即使是从缓存加载）
						modalImg.src = imageSrc;
					}
		
					modal.style.display = 'flex';
		
					// 更新图片计数器
					this.updateImageCounter();
		
					// 预加载相邻图片
					this.preloadAdjacentImages();
				},
		
				// 更新图片计数器
				updateImageCounter: function() {
					const counter = document.querySelector('.image-counter');
					if (counter) {
						const totalImages = Object.values(CG_CONFIG_SUB).length;
						counter.textContent = `${this.currentImageIndex + 1} / ${totalImages}`;
					}
				},
		
				// 预加载相邻图片（前进方向）
				preloadAdjacentImages: function() {
					const paths = Object.values(CG_CONFIG_SUB);
		
					// 预加载前后各2张图片
					for (let i = Math.max(0, this.currentImageIndex - 2); i <= Math.min(paths.length - 1, this
							.currentImageIndex + 2); i++) {
						if (i !== this.currentImageIndex) {
							this.preloadImage(paths[i]);
						}
					}
				},
		
				// 预加载单张图片到内存
				preloadImage: function(imageSrc) {
					if (this.imageCache[imageSrc]) {
						return; // 已经在缓存中
					}
		
					// 检查缓存大小，如果超过限制则清理最旧的项
					const keys = Object.keys(this.imageCache);
					if (keys.length >= this.maxCacheSize) {
						// 删除第一个（最老的）缓存项
						delete this.imageCache[keys[0]];
					}
		
					const img = new Image();
					img.src = imageSrc;
		
					// 当图片加载完成后，将其存储到缓存中
					img.onload = () => {
						this.imageCache[imageSrc] = img;
						console.log(`[INFO] Image preloaded to cache: ${imageSrc}`);
					};
		
					img.onerror = () => {
						console.warn(`[WARN] Failed to preload image: ${imageSrc}`);
					};
				},
		
				// 显示上一张图片
				showPrevImage: function() {
					const paths = Object.values(CG_CONFIG_SUB);
					this.currentImageIndex--;
					if (this.currentImageIndex < 0) {
						this.currentImageIndex = paths.length - 1; // 首尾循环
					}
		
					// 更新缓存中的相邻图片
					this.preloadAdjacentImages();
		
					this.showFullImage(paths[this.currentImageIndex]);
				},
		
				// 显示下一张图片
				showNextImage: function() {
					const paths = Object.values(CG_CONFIG_SUB);
					this.currentImageIndex++;
					if (this.currentImageIndex >= paths.length) {
						this.currentImageIndex = 0; // 首尾循环
					}
		
					// 更新缓存中的相邻图片
					this.preloadAdjacentImages();
		
					this.showFullImage(paths[this.currentImageIndex]);
				},
		
				// 绑定事件
				bindEvents: function() {
					// 关闭模态框
					document.querySelector('.close').addEventListener('click', () => {
						document.getElementById('imageModal').style.display = 'none';
					});
		
					// 点击模态框外部关闭
					document.getElementById('imageModal').addEventListener('click', (e) => {
						if (e.target === document.getElementById('imageModal')) {
							e.target.style.display = 'none';
						}
					});
		
					// 上一张图片按钮
					document.querySelector('.prev-nav').addEventListener('click', () => {
						CGManager.showPrevImage();
					});
		
					// 下一张图片按钮
					document.querySelector('.next-nav').addEventListener('click', () => {
						CGManager.showNextImage();
					});
		
					// 键盘事件：左箭头键上一张，右箭头键下一张
					document.addEventListener('keydown', (e) => {
						if (document.getElementById('imageModal').style.display === 'flex' ||
							document.getElementById('imageModal').style.display === 'block') {
							if (e.key === 'ArrowLeft') {
								e.preventDefault();
								CGManager.showPrevImage();
							} else if (e.key === 'ArrowRight') {
								e.preventDefault();
								CGManager.showNextImage();
							}
						}
					});
		
					// ESC键功能：如果模态框打开则关闭，否则返回主页
					document.addEventListener('keydown', (e) => {
						if (e.key === 'Escape') {
							const modal = document.getElementById('imageModal');
							if (modal.style.display === 'flex' || modal.style.display === 'block') {
								// 如果模态框是打开的，关闭它
								modal.style.display = 'none';
							} else {
								// 如果模态框是关闭的，返回主页
								window.location.href = '../index.html';
							}
						}
					});
				}
			};
		
			// 初始化引擎并播放BGM，以及CG管理器
			document.addEventListener('DOMContentLoaded', function() {
				gameEngine.init(indexData);
		
				// 播放BGM
				setTimeout(function() {
					gameEngine.playAudio('bgm1');
