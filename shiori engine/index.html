<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiori - 主菜单</title>
    <link rel="stylesheet" href="style.css">
    <script src="illustration.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('assets/cg/bg.jpg') center center/cover no-repeat;/*修改背景图片url*/
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
        }

        /* 菜单容器 - 占据右侧50% */
        #menu-container {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 菜单标题 */
        #menu-title {
            color: white;
            font-size: 32px;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 菜单按钮 */
        .menu-btn {
            display: block;
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            background-color: transparent;
            color: #FFD700;
            border: 3px solid #FFD700;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background-color: rgba(255, 215, 0, 0.2);
            color: #FFA500;
            border: 3px solid #FFA500;
            transform: scale(1.05);
        }

        /* 隐藏游戏相关元素 */
        #background-container,
        #character-container,
        #text-box-container,
        #options-container,
        #novel-mode-container {
            display: none;
        }

        /* 音频播放器保持可见但透明以确保功能*/
        audio {
            display: none;
        }
        
        /* 信息容器内的链接样式 */
        #info-container a {
            color: pink;
            text-decoration: none;
        }
        
        #info-container a:visited {
            color: pink;
        }
        
        #info-container a:hover {
            color: lightpink;
            text-decoration: underline;
        }
        
        /* ========================================
           响应式设计 - 主菜单适配
           注意：仅设置字体大小、间距，不改变布局百分比
           ======================================== */
        
        /* 信息容器基础样式 */
        #info-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: gold;
            font-family: 'Microsoft YaHei', sans-serif;
            z-index: 10;
            font-size: 16px;
            text-shadow: 1px 1px 2px black;
            line-height: 1.6;
            max-width: 45%;
            overflow-wrap: break-word;
        }

/* 右下角信息容器样式 */
        #info-container-right {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: gold;
            font-family: 'Microsoft YaHei', sans-serif;
            z-index: 10;
            font-size: 16px;
            text-shadow: 1px 1px 2px black;
            line-height: 1.6;
            max-width: 45%;
            overflow-wrap: break-word;
            text-align: right;
        }

        /* 小屏幕适配（1366x768） */
        @media (max-width: 1366px) and (max-height: 768px) {
            #menu-title {
                font-size: 28px;
                margin-bottom: 30px;
            }
            
            .menu-btn {
                font-size: 16px;
                padding: 12px;
                margin: 8px 0;
            }
            
            #info-container {
                font-size: 14px;
                bottom: 15px;
                left: 15px;
                max-width: 40%;
                line-height: 1.5;
            }
            
            #info-container-right {
                font-size: 14px;
                bottom: 15px;
                right: 15px;
                max-width: 40%;
                line-height: 1.5;
            }
        }
        
        /* 更小屏幕适配（1280x720） */
        @media (max-width: 1280px) and (max-height: 720px) {
            #menu-title {
                font-size: 24px;
                margin-bottom: 25px;
            }
            
            .menu-btn {
                font-size: 14px;
                padding: 10px;
                margin: 6px 0;
            }
            
            #info-container {
                font-size: 12px;
                bottom: 10px;
                left: 10px;
                max-width: 35%;
                line-height: 1.4;
            }
            
            #info-container-right {
                font-size: 12px;
                bottom: 10px;
                right: 10px;
                max-width: 35%;
                line-height: 1.4;
            }
        }
        
        /* 极小屏幕适配（宽度 < 800px） */
        @media (max-width: 800px) {
            #menu-title {
                font-size: 20px;
                margin-bottom: 20px;
            }
            
            .menu-btn {
                font-size: 12px;
                padding: 8px;
                margin: 5px 0;
            }
            
            #info-container {
                font-size: 11px;
                bottom: 8px;
                left: 8px;
                max-width: 45%;
                line-height: 1.3;
            }
            
            #info-container-right {
                font-size: 11px;
                bottom: 8px;
                right: 8px;
                max-width: 45%;
                line-height: 1.3;
            }
        }
        
        /* 超小高度适配（高度 < 500px） */
        @media (max-height: 500px) {
            #menu-title {
                font-size: 18px;
                margin-bottom: 15px;
            }
            
            .menu-btn {
                font-size: 11px;
                padding: 6px;
                margin: 4px 0;
            }
            
            #info-container {
                font-size: 10px;
                bottom: 5px;
                left: 5px;
                max-width: 40%;
                line-height: 1.2;
            }
            
            #info-container-right {
                font-size: 10px;
                bottom: 5px;
                right: 5px;
                max-width: 40%;
                line-height: 1.2;
            }
        }
    </style>
</head>
<body>

    <!-- 音频播放器-->

    <script src="engine.js"></script>
    <script>
        if (window.location.protocol === 'file:') {
            // 禁用进度管理按钮
            const progressBtn = document.getElementById('progress-btn');
            if (progressBtn) {
                progressBtn.href = "#";
                progressBtn.textContent = "进度管理（file下无法使用该功能）";
                progressBtn.style.opacity = "0.6";
                progressBtn.style.cursor = "not-allowed";
                progressBtn.onclick = function(e) {
                    e.preventDefault();
                    return false;
                };
            }
            
            // 禁用存档按钮
            const archiveLinks = document.querySelectorAll('a[href*="archive.html"]');
            archiveLinks.forEach(function(link) {
                link.href = "#";
                link.textContent = "存档（file下无法使用该功能）";
                link.style.opacity = "0.6";
                link.style.cursor = "not-allowed";
                link.onclick = function(e) {
                    e.preventDefault();
                    return false;
                };
            });
            
            // 禁用剧本流程图按钮（依赖sessionStorage）
            const flowchartLinks = document.querySelectorAll('a[href*="flowchart"]');
            flowchartLinks.forEach(function(link) {
                link.href = "#";
                link.textContent = link.textContent.replace(/\(.*?\)/, '') + '（file下无法使用该功能）';
                link.style.opacity = "0.6";
                link.style.cursor = "not-allowed";
                link.onclick = function(e) {
                    e.preventDefault();
                    return false;
                };
            });
        }
        const indexData = {
            bgm: BGM_CONFIG,
            story: [
                {
                    text: "",
                    bgm: 'bgm1',
                    action: null
                }
            ]
        };
        document.addEventListener('DOMContentLoaded', function() {
            gameEngine.init(indexData);
            setTimeout(function() {
                gameEngine.playAudio('bgm1');
            }, 100);
            
            // 预加载CG鉴赏页面的全尺寸图片，避免打开时的卡顿
            preloadCGFullImages();
        });
        
        // 预加载CG全尺寸图片函数（只预加载关键图片，其余使用懒加载）
        function preloadCGFullImages() {
            if (typeof CG_CONFIG === 'undefined') {
                console.log('[INFO] CG_CONFIG not loaded, skipping full image preload');
                return;
            }
            
            const paths = Object.values(CG_CONFIG);
            const totalImages = paths.length;
            
            // 从配置中获取预加载数量
            const strategy = typeof CG_LOAD_STRATEGY !== 'undefined' ? CG_LOAD_STRATEGY.INDEX_PAGE : { eagerLoadCount: 5, enableLazyLoad: true, lazyLoadDelay: 500 };
            const preloadCount = Math.min(strategy.eagerLoadCount, totalImages);
            const pathsToPreload = paths.slice(0, preloadCount);
            
            console.log(`[INFO] Smart preloading ${preloadCount}/${totalImages} CG images (lazy load the rest)...`);
            
            let loadedCount = 0;
            let failedCount = 0;
            
            // 预加载关键图片
            pathsToPreload.forEach(function(path, index) {
                const img = new Image();
                
                img.onload = function() {
                    loadedCount++;
                    console.log(`[INFO] Critical CG image cached (${loadedCount}/${preloadCount}): ${path}`);
                };
                
                img.onerror = function() {
                    failedCount++;
                    console.warn(`[WARN] Failed to preload critical CG image: ${path}`);
                };
                
                img.src = path;
            });
            
            // 对其余图片创建轻量级占位符，触发浏览器懒加载
            if (strategy.enableLazyLoad) {
                setTimeout(() => {
                    const remainingPaths = paths.slice(preloadCount);
                    remainingPaths.forEach(function(path) {
                        const img = new Image();
                        img.loading = 'lazy'; // 启用浏览器原生懒加载
                        img.src = path; // 这会让浏览器在需要时才真正加载
                    });
                    console.log(`[INFO] Registered ${remainingPaths.length} CG images for lazy loading`);
                }, strategy.lazyLoadDelay);
            }
        }

    </script>
