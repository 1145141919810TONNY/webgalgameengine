<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立绘系统综合测试场景</title>
    <link rel="icon" type="image/png" href="../icon/icon-32.png">
    <link rel="stylesheet" href="../style.css">
    <script src="../bgm_config.js"></script>
    <script src="../cg_config.js"></script>
    <script src="../bg_config.js"></script>
    <script src="../illustration.js"></script>
    <script src="../modules/progress_api.js"></script>
</head>
<body>
    <div id="background-container"></div>
    <div id="character-container"></div>
    <div id="text-box-container">
        <div id="name-box">[姓名]</div>
        <div id="text-box">[文本]</div>
    </div>
    <div id="options-container"></div>
    <div id="novel-mode-container">
        <div id="novel-text-box">[全屏文本]</div>
    </div>
    <audio id="bgm-player" loop></audio>
    <audio id="se-player"></audio>
    <audio id="voice-player"></audio>
    <div id="video-player" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; z-index:100; background-color:black;">
        <video id="main-video" style="width:100%; height:100%; object-fit:contain;" controls>
            您的浏览器不支持视频播放。
        </video>
    </div>
    <div id="context-menu-backdrop" class="context-menu-backdrop"></div>
    <div id="context-menu" class="context-menu">
        <ul>
            <li onclick="window.location.href='../saves.html'">进度管理</li>
            <li onclick="window.location.href='../index.html'">返回标题页面</li>
        </ul>
    </div>
    <script src="../engine.js"></script>
    <script>
        const sceneData = {
            background: BG_CONFIG_SUB,
            bgm: BGM_CONFIG_SUB,
            audio: {},
            story: [
                { 
                    text: "欢迎进入立绘系统综合测试场景。本场景将按照功能模块对指令进行系统性验证。", 
                    speaker: "系统",
                    background: "bg_001_00_00",
                    chars: null
                },
                
                // ========== 1. 基础显示与默认行为 ==========
                {
                    text: "【基础-1】仅角色ID - [lh1]。验证默认行为：居中、底部对齐、无缩放、基础层级。",
                    speaker: "系统",
                    chars: "[lh1]"
                },
                {
                    text: "【基础-2】多立绘默认 - [lh1],[lh2]。验证多个立绘同时显示时的默认堆叠顺序。",
                    speaker: "系统",
                    chars: "[lh1],[lh2]"
                },
                {
                    text: "清除立绘，准备进入位置控制测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 2. 位置控制 (水平/垂直/精确坐标) ==========
                {
                    text: "【位置-1】水平位置枚举 - [左左 lh1] (15%) -> [左 lh1] (25%) -> [左右 lh1] (35%)",
                    speaker: "系统",
                    chars: "[左左 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[左 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[左右 lh1]"
                },
                {
                    text: "【位置-2】水平位置枚举 - [中 lh1] (50%) -> [右左 lh1] (65%) -> [右 lh1] (75%) -> [右右 lh1] (85%)",
                    speaker: "系统",
                    chars: "[中 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[右左 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[右 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[右右 lh1]"
                },
                {
                    text: "【位置-3】垂直偏移枚举 - [中 下 lh1] (-25%) -> [中 中下 lh1] (-50%) -> [中 下下 lh1] (-65%)",
                    speaker: "系统",
                    chars: "[中 下 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[中 中下 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[中 下下 lh1]"
                },
                {
                    text: "【位置-4】垂直偏移枚举 - [中 上 lh1] (25%) -> [中 中上 lh1] (50%) -> [中 上上 lh1] (65%)",
                    speaker: "系统",
                    chars: "[中 上 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[中 中上 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[中 上上 lh1]"
                },
                {
                    text: "【位置-5】精确坐标 X轴 - [x:-15% lh1] -> [x:15% lh1]。以屏幕中心为基准的左右平移。",
                    speaker: "系统",
                    chars: "[x:-15% lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[x:15% lh1]"
                },
                {
                    text: "【位置-6】精确坐标 Y轴 - [y:10% lh1] -> [y:-10% lh1]。以屏幕底部为基准的上下平移。",
                    speaker: "系统",
                    chars: "[y:10% lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[y:-10% lh1]"
                },
                {
                    text: "【位置-7】坐标组合 - [x:10% y:5% lh1]。同时指定水平和垂直精确坐标。",
                    speaker: "系统",
                    chars: "[x:10% y:5% lh1]"
                },
                {
                    text: "清除立绘，准备进入外观属性测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 3. 外观属性 (层级/缩放) ==========
                {
                    text: "【外观-1】层级控制 - [中 前 lh1],[中 后 lh2]。lh1(zIndex:11) 覆盖在 lh2(zIndex:9) 之上。",
                    speaker: "系统",
                    chars: "[中 前 lh1],[中 后 lh2]"
                },
                {
                    text: "【外观-2】缩放比例 - [中 20% lh1] -> [中 -20% lh1]。分别展示放大到120%和缩小到80%。",
                    speaker: "系统",
                    chars: "[中 20% lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[中 -20% lh1]"
                },
                {
                    text: "【外观-3】复杂外观组合 - [右 前 15% lh1]。右侧 + 顶层 + 放大15%。",
                    speaker: "系统",
                    chars: "[右 前 15% lh1]"
                },
                {
                    text: "清除立绘，准备进入动画与瞬移测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 4. 动画与瞬移 ==========
                {
                    text: "【动画-1】普通过渡 - [左 lh1] -> [右 lh1]。观察0.5秒的平滑移动动画。",
                    speaker: "系统",
                    chars: "[左 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[右 lh1]"
                },
                {
                    text: "【动画-2】瞬移效果 - [瞬 左 lh1] -> [瞬 右 lh1]。立绘立即切换位置，无过渡动画。",
                    speaker: "系统",
                    chars: "[瞬 左 lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[瞬 右 lh1]"
                },
                {
                    text: "清除立绘，准备进入高级动作指令测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 5. 高级动作指令 ==========
                {
                    text: "【动作-1】后退效果 - [中 retreat lh1]。Y轴向上+10%，缩小10%，层级强制变后。",
                    speaker: "系统",
                    chars: "[中 retreat lh1]"
                },
                {
                    text: "【动作-2】前进效果 - [中 forward lh1]。Y轴向下-10%，放大10%，层级强制变前。",
                    speaker: "系统",
                    chars: "[中 forward lh1]"
                },
                {
                    text: "【动作-3】吓一跳 - [中 scare lh1]。快速放大再缩小，重复2次。",
                    speaker: "系统",
                    chars: "[中 scare lh1]"
                },
                {
                    text: "【动作-4】发抖 - [中 shake lh1]。X轴快速左右抖动3次。",
                    speaker: "系统",
                    chars: "[中 shake lh1]"
                },
                {
                    text: "【动作-5】持续发抖与停止 - [中 cshake lh1] (开始) -> [sshake lh1] (停止)。",
                    speaker: "系统",
                    chars: "[中 cshake lh1]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[sshake lh1]"
                },
                {
                    text: "清除立绘，准备进入连续动作序列测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 6. 连续动作序列 (V1.1.3) ==========
                {
                    text: "【序列-1】基础连续 - [左,中,右 lh1]。立绘依次经过三个位置，每步间隔0.5秒。",
                    speaker: "系统",
                    chars: "[左,中,右 lh1]"
                },
                {
                    text: "【序列-2】属性继承 - [左 前,右 lh1]。Step 1只指定了'右'，因此继承了Step 0的'前'层级。",
                    speaker: "系统",
                    chars: "[左 前,右 lh1]"
                },
                {
                    text: "【序列-3】片段内瞬移 - [左,右 上 后 瞬,中 lh1]。第二步瞬间完成并停留0.5秒，验证瞬移不跳过展示时间。",
                    speaker: "系统",
                    chars: "[左,右 上 后 瞬,中 lh1]"
                },
                {
                    text: "【序列-4】独立标记瞬移 - [左,瞬,右 lh1]。从左侧瞬间移动到右侧。",
                    speaker: "系统",
                    chars: "[左,瞬,右 lh1]"
                },
                {
                    text: "【序列-5】超长序列（8个片段） - [左,中,右,左左,右右,中下,上上,中 lh1]",
                    speaker: "系统",
                    chars: "[左,中,右,左左,右右,中下,上上,中 lh1]"
                },
                {
                    text: "【序列-6】中断测试 - [左,中,右 lh1] (请在动画过程中点击鼠标，立绘应直接跳到最右侧)",
                    speaker: "系统",
                    chars: "[左,中,右 lh1]"
                },
                {
                    text: "清除立绘，准备进入清除与管理测试。",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 7. 清除与管理 ==========
                {
                    text: "【管理-1】单立绘消失 - [左 lh1],[中 lh2] -> [消失 lh1]。仅移除 lh1。",
                    speaker: "系统",
                    chars: "[左 lh1],[中 lh2]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[消失 lh1]"
                },
                {
                    text: "【管理-2】批量清除 - [左 lh1],[中 lh2] -> [消失 all]。一键清空所有立绘。",
                    speaker: "系统",
                    chars: "[左 lh1],[中 lh2]"
                },
                {
                    text: "",
                    speaker: "系统",
                    chars: "[消失 all]"
                },

                // ========== 8. 边界与冲突测试 (负面/压力测试) ==========
                {
                    text: "【冲突-1】同类关键词冲突 - [左 右 lh1]。取第一个'左'，忽略'右'。",
                    speaker: "系统",
                    chars: "[左 右 lh1]"
                },
                {
                    text: "【冲突-2】中英文混合冲突 - [left 右 lh1]。取第一个'left'，忽略'右'。",
                    speaker: "系统",
                    chars: "[left 右 lh1]"
                },
                {
                    text: "【冲突-3】精确坐标优先 - [x:10% 左 lh1]。精确坐标 x:10% 优先级高于文字指令'左'。",
                    speaker: "系统",
                    chars: "[x:10% 左 lh1]"
                },
                {
                    text: "【冲突-4】多重水平冲突 - [x:10% 左 右 middle lh1] (应使用x:10%，忽略所有水平关键词)",
                    speaker: "系统",
                    chars: "[x:10% 左 右 middle lh1]"
                },
                {
                    text: "【冲突-5】复杂冲突 - [left right 下 downm front back 10% lh1] (每类取第一个：left=25%, down=-25%, front=zIndex:11, scale=110%)",
                    speaker: "系统",
                    chars: "[left right 下 downm front back 10% lh1]"
                },
                {
                    text: "所有测试完成！您已验证了立绘系统的核心功能、高级特性及边界情况。",
                    speaker: "系统",
                    chars: null
                }
            ]
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            gameEngine.init(sceneData);
        });
    </script>
</body>
</html>
